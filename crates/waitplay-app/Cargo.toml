[package]
name = "waitplay-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Vibe Play companion window and desktop widget"

[[bin]]
name = "waitplay"
path = "src/main.rs"

[dependencies]
waitplay-core.workspace = true
waitplay-auth = { path = "../waitplay-auth" }
serde.workspace = true
serde_json.workspace = true
tao = "0.37.2"
wry = "0.57.3"
global-hotkey = "0.10.0"

[features]
# Test-only switches (e.g. expanding the widget without a click for CI screenshots). Never enabled for a shipped build.
test-hooks = []

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
tray-icon = { version = "0.21", default-features = false }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Variant",
    "Win32_System_Ole",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_JobObjects",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = { version = "0.21", default-features = false }
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSArray", "NSString", "NSObject"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSWorkspace", "NSRunningApplication", "NSScreen", "NSEvent", "NSApplication", "NSResponder", "NSWindow", "NSView", "NSGraphics", "NSVisualEffectView"] }
