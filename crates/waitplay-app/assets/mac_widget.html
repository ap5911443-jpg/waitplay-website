/* Vibe Play notch (macOS).
   On a MacBook with a camera notch the app places this transparent window flush with the top edge of the display, centred on the
   notch (`S.notch` = its size in points). The black shape starts exactly as big as the hardware notch, so at rest it is invisible
   and part of the machine; when an agent works it grows downward and sideways out of the notch. On Macs without a notch (and on
   external displays) the same shape is a floating capsule under the menu bar. The shape is opaque black, so nothing here depends on
   macOS' blur or on Reduce Transparency.
   The edge light is a ring (mask) around the shape: a moving gradient lights left, right and bottom; the colour follows the agent's
   state. Nothing animates while the state is steady. */
@property --s{syntax:"<percentage>";inherits:true;initial-value:0%}
@property --c{syntax:"<color>";inherits:true;initial-value:rgba(255,255,255,.07)}
:root{
  --bg:#000; --fg:#fff; --fg2:rgba(235,235,245,.62); --accent:#2fd28b; --line:rgba(255,255,255,.09); --chip:rgba(255,255,255,.08); --chip-hover:rgba(255,255,255,.14);
  --ease:cubic-bezier(.32,.72,0,1); --spring:cubic-bezier(.22,1.15,.36,1);
  --c:rgba(255,255,255,.07); --base:rgba(255,255,255,.05); --glow:0;
}
*{box-sizing:border-box}
html,body{margin:0;background:transparent;overflow:hidden;color:var(--fg);
  font:500 12.5px "Figtree",-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  user-select:none;-webkit-user-select:none;cursor:default}

#wrap{display:flex;justify-content:center;align-items:flex-start;padding:0 24px 26px;width:auto}
#wrap.pill{padding-top:8px}
#shell{position:relative;flex:none;width:200px;height:34px;border-radius:0 0 11px 11px;
  transition:width .5s var(--ease),height .5s var(--ease),border-radius .5s var(--ease),--c .6s ease,opacity .25s ease,transform .5s var(--spring)}
#shell.hide{opacity:0}
#shell.pill{border-radius:16px}

/* edge light: a thin ring plus a soft glow, both clipped so the top edge (the display's own edge) stays dark */
#rim,#glow{position:absolute;pointer-events:none;border-radius:inherit;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);
  background:
    linear-gradient(90deg,transparent calc(50% - var(--s) - 16%),var(--c) calc(50% - var(--s)),transparent calc(50% - var(--s) + 16%)),
    linear-gradient(90deg,transparent calc(50% + var(--s) - 16%),var(--c) calc(50% + var(--s)),transparent calc(50% + var(--s) + 16%)),
    linear-gradient(var(--base),var(--base));
  transition:opacity .4s ease}
#rim{inset:0;padding:1.25px;opacity:1}
#glow{inset:-5px;padding:6px;filter:blur(7px);opacity:0}
#shell:not(.pill) #rim{clip-path:inset(2px -4px -4px -4px)}
#shell:not(.pill) #glow{clip-path:inset(6px -30px -30px -30px)}
#shell[data-phase=start]{--c:#ffb02e;--base:rgba(255,176,46,.34)}
#shell[data-phase=work]{--c:#2fd28b;--base:rgba(47,210,139,.30)}
#shell[data-phase=ent]{--c:#b7a6ff;--base:rgba(183,166,255,.30)}
#shell[data-phase=done]{--c:#8dffb8;--base:rgba(141,255,184,.46)}
#shell[data-phase=error]{--c:#ff6159;--base:rgba(255,97,89,.36)}
#shell[data-phase=paused]{--c:#a58b45;--base:rgba(165,139,69,.22)}
#shell[data-phase=idle]{--c:rgba(255,255,255,.07);--base:rgba(255,255,255,.05)}
#shell[data-phase]:not([data-phase=idle]) #glow{opacity:.62}
#shell.hover #rim{filter:brightness(1.5)}
#shell.sweep #rim,#shell.sweep #glow{animation:sweep .85s cubic-bezier(.3,.55,.25,1) both}
@keyframes sweep{from{--s:0%}to{--s:64%}}

#clip{position:absolute;inset:0;border-radius:inherit;overflow:hidden;background:var(--bg);box-shadow:inset 0 -1px 0 rgba(255,255,255,.04)}

/* content */
.row{display:flex;align-items:center}
#nbar,#bar{position:absolute;left:0;right:0;top:0;display:none}
#shell.nm #nbar{display:block} #shell.pill #bar{display:block}
#nbar .r1{height:var(--nh,34px);padding:0 14px;justify-content:space-between}
#nbar .ear{display:flex;align-items:center;gap:8px;min-width:0;flex:1;opacity:0;transition:opacity .22s ease}
#nbar .ear.r{justify-content:flex-end}
#nbar .gap{flex:none;width:var(--nw,200px)}
#nbar .r2{height:54px;padding:0 18px 4px;gap:12px;opacity:0;transform:translateY(-6px);transition:opacity .22s ease,transform .45s var(--ease)}
#shell.live #nbar .ear,#shell.open #nbar .ear{opacity:1;transition-delay:.18s}
#shell.live #nbar .r2,#shell.open #nbar .r2{opacity:1;transform:none;transition-delay:.2s}
#nbar .r1{display:flex}
#logo{width:20px;height:20px;flex:none;position:relative}
#logo>svg{width:100%;height:100%;display:block}
.dot{position:absolute;right:-3px;bottom:-3px;width:9px;height:9px;border-radius:50%;background:#4a4a4f;box-shadow:0 0 0 2px #000;display:flex;align-items:center;justify-content:center;transition:background .3s}
.dot svg{display:none;width:6px;height:6px;fill:none;stroke:#000;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
#shell[data-phase=start] .dot{background:#ffb02e} #shell[data-phase=work] .dot{background:#2fd28b} #shell[data-phase=ent] .dot{background:#b7a6ff}
#shell[data-phase=error] .dot{background:#ff6159} #shell[data-phase=paused] .dot{background:#a58b45}
#shell[data-phase=done] .dot{background:#8dffb8} #shell[data-phase=done] .dot svg{display:block}
.t{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.txt{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.ttl{font-size:14px;font-weight:600;line-height:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-size:11.5px;line-height:14px;color:var(--fg2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub:empty{display:none}
.inds{display:flex;gap:5px;flex:none}
.ind{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#6b6b70;background:var(--chip);transition:background .3s,color .3s,box-shadow .3s}
.ind.on{color:#fff;background:rgba(47,210,139,.18);box-shadow:inset 0 0 0 1px rgba(47,210,139,.55)}
.ind svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ind svg .f{fill:currentColor;stroke:none}
.chev{all:unset;box-sizing:border-box;width:26px;height:26px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:var(--chip);color:var(--fg2);cursor:pointer;transition:background .2s,color .2s,transform .5s var(--spring)}
.chev:hover{background:var(--chip-hover);color:#fff}
.chev svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#shell.open .chev{transform:rotate(180deg)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bars{display:flex;align-items:center;gap:2.5px;height:14px}
.bars i{display:block;width:2.5px;height:4px;border-radius:2px;background:#4a4a4f}
#shell[data-phase=work] .bars i,#shell[data-phase=start] .bars i{background:var(--c);animation:eq 1.1s ease-in-out infinite}
#shell[data-phase=work] .bars i:nth-child(2),#shell[data-phase=start] .bars i:nth-child(2){animation-delay:.18s}
#shell[data-phase=work] .bars i:nth-child(3),#shell[data-phase=start] .bars i:nth-child(3){animation-delay:.36s}
@keyframes eq{0%,100%{height:4px}50%{height:12px}}

/* pill mode (no notch): the same content in one row */
#bar{height:var(--bh,36px);padding:0 10px 0 8px;align-items:center;gap:10px;cursor:pointer}
#bar{display:none}
#shell.pill #bar{display:flex}
#shell.pill #bar>*{transition:opacity .22s ease}
#bar .rest{font-size:12.5px;font-weight:600;white-space:nowrap}
#shell.pill.live #bar .rest,#shell.pill.open #bar .rest{display:none}
#shell.pill:not(.live):not(.open) #bar .txt,#shell.pill:not(.live):not(.open) #bar .t,#shell.pill:not(.live):not(.open) #bar .inds,#shell.pill:not(.live):not(.open) #bar .chev{display:none}
#shell.pill.live #bar .bars,#shell.pill.open #bar .bars{display:none}

/* panel */
#body{position:absolute;left:0;right:0;top:var(--bh,36px);padding:0 18px 16px;opacity:0;pointer-events:none;transition:opacity .2s ease}
#shell.open #body{opacity:1;pointer-events:auto;transition:opacity .3s ease .16s}
.sep{height:1px;background:var(--line);margin:2px 0 10px}
.row2k{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:26px}
.k{font-size:12px;color:var(--fg2)} .v{font-size:12.5px;font-weight:600;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#plats{display:flex;gap:6px;margin:8px 0 10px}
.plat{all:unset;box-sizing:border-box;flex:1;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--chip);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.05);font-size:12px;font-weight:600;color:var(--fg2);cursor:pointer;transition:background .2s,color .2s,box-shadow .2s,transform .2s var(--spring)}
.plat:hover{background:var(--chip-hover);color:#fff} .plat:active{transform:scale(.97)}
.plat.on{background:rgba(47,210,139,.18);color:#fff;box-shadow:inset 0 0 0 1px rgba(47,210,139,.55)}
.plat svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.plat svg .f{fill:currentColor;stroke:none}
.plat[hidden]{display:none}
#foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.sw{all:unset;box-sizing:border-box;width:38px;height:22px;border-radius:11px;background:#2a2a2e;position:relative;cursor:pointer;transition:background .25s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .3s var(--spring)}
.sw[aria-checked=true]{background:var(--accent)} .sw[aria-checked=true]::after{transform:translateX(16px)}
.link{all:unset;box-sizing:border-box;font-size:12px;font-weight:600;color:var(--accent);cursor:pointer;padding:4px 8px;border-radius:8px;transition:background .2s,color .2s}
.link:hover{background:var(--chip);color:#fff}

@media (prefers-reduced-motion: reduce){
  *{transition:none!important;animation:none!important}
}
@media (prefers-contrast: more){ :root{--fg2:rgba(255,255,255,.85);--line:rgba(255,255,255,.3)} }

body.demo{background:linear-gradient(135deg,#e8d9c8 0%,#b8c6e8 100%);min-height:100vh;overflow:auto}
body.demo.dark{background:linear-gradient(135deg,#1b2340 0%,#3a2a58 50%,#5a3a45 100%)}
body.demo #menubarsim{position:fixed;left:0;right:0;top:0;height:34px;background:rgba(255,255,255,.55);z-index:-1}
body.demo #wrap{margin:0 auto}
#demo{position:fixed;left:12px;bottom:12px;display:flex;flex-wrap:wrap;gap:6px;max-width:640px}
#demo button{font:11px -apple-system,"Segoe UI",system-ui,sans-serif;padding:3px 9px;border-radius:7px;border:0;background:rgba(0,0,0,.75);color:#fff;cursor:pointer}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8b92ff"/><stop offset="1" stop-color="#4046e0"/></linearGradient></defs></svg>
<div id="wrap">
  <div id="shell" class="hide" data-phase="idle">
    <div id="glow"></div><div id="rim"></div>
    <div id="clip">
      <div id="nbar">
        <div class="r1 row">
          <div class="ear l"><span id="logo"><svg viewBox="0 0 34 34" aria-hidden="true"><rect x="1" y="1" width="32" height="32" rx="9" fill="url(#g)"/><path d="M13 9.5v15l12-7.5z" fill="#fff" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"/></svg><span class="dot"><svg viewBox="0 0 8 8"><path d="M1.5 4.2 3.3 6 6.5 2"/></svg></span></span><span class="t" id="nbrand">Vibe Play</span></div>
          <div class="gap"></div>
          <div class="ear r"><span class="t" id="ntimer"></span><span class="bars" id="nbars" aria-hidden="true"><i></i><i></i><i></i></span></div>
        </div>
        <div class="r2 row" id="nr2" role="button" tabindex="0" aria-label="Expand Vibe Play">
          <div class="txt"><span class="ttl" id="ntitle"></span><span class="sub" id="nsub"></span></div>
          <div class="inds" id="ninds" aria-hidden="true"></div>
          <button class="chev" id="nchev" type="button" aria-label="Expand" aria-expanded="false"><svg viewBox="0 0 12 12"><path d="M3 4.5 6 7.5 9 4.5"/></svg></button>
        </div>
      </div>
      <div id="bar" role="button" tabindex="0" aria-label="Expand Vibe Play">
        <span id="plogo" style="position:relative;width:22px;height:22px;flex:none"><svg viewBox="0 0 34 34" aria-hidden="true" style="width:100%;height:100%;display:block"><rect x="1" y="1" width="32" height="32" rx="9" fill="url(#g)"/><path d="M13 9.5v15l12-7.5z" fill="#fff" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"/></svg><span class="dot"><svg viewBox="0 0 8 8"><path d="M1.5 4.2 3.3 6 6.5 2"/></svg></span></span>
        <span class="rest" id="prest">Vibe Play</span>
        <span class="bars" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="txt"><span class="ttl" id="ptitle"></span><span class="sub" id="psub"></span></span>
        <span class="t" id="ptimer"></span>
        <span class="inds" id="pinds" aria-hidden="true"></span>
        <button class="chev" id="pchev" type="button" aria-label="Expand" aria-expanded="false"><svg viewBox="0 0 12 12"><path d="M3 4.5 6 7.5 9 4.5"/></svg></button>
      </div>
      <div id="body">
        <div class="sep"></div>
        <div class="row2k"><span class="k">Agent</span><span class="v" id="vAgent"></span></div>
        <div class="row2k"><span class="k">Status</span><span class="v" id="vStatus"></span></div>
        <div class="row2k"><span class="k">Active sessions</span><span class="v" id="vSessions"></span></div>
        <div id="plats" role="radiogroup" aria-label="Entertainment platform"></div>
        <div id="foot">
          <span class="row2k" style="gap:10px"><span class="k">Automation</span><button class="sw" id="sw" type="button" role="switch" aria-checked="true" aria-label="Automation"></button></span>
          <button class="link" id="settings" type="button">Settings…</button>
        </div>
      </div>
    </div>
  </div>
</div>
<div id="menubarsim" style="display:none"></div>
<script>
(function(){
  const send = m => window.ipc && window.ipc.postMessage(JSON.stringify(m));
  const $ = id => document.getElementById(id);
  const NS = 'http://www.w3.org/2000/svg';
  const wrap = $('wrap'), shell = $('shell'), body = $('body');
  const GLYPHS = {
    instagram: [['rect',{x:2,y:2,width:12,height:12,rx:3.5}],['circle',{cx:8,cy:8,r:2.8}],['circle',{cx:11.6,cy:4.4,r:.5}]],
    x: [['path',{d:'M3 3l10 10M13 3L3 13'}]],
    youtube: [['rect',{x:1.5,y:3.5,width:13,height:9,rx:3}],['path',{d:'M6.7 6v4l3.5-2z',class:'f'}]]
  };
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
  let S = {}, expanded = false, lastLabel = null, lastSize = '', shrinkTimer = 0, tickTimer = 0, hoverTimer = 0, dwellTimer = 0, sweepTimer = 0, phaseTimer = 0, relayTimer = 0;
  let prevActive = false, startUntil = 0, doneUntil = 0, lastAgent = '', pointerIn = false;
  const PAD_X = 24, PAD_B = 26;

  /* ---- geometry ---- */
  const hasNotch = () => !!(S.notch && S.notch.w > 0 && (S.corner || 'top-center') === 'top-center');
  const NW = () => Math.round(S.notch ? S.notch.w : 200), NH = () => Math.round(S.notch ? S.notch.h : 34);
  const isActive = () => { const st = S.status || 'idle'; return st === 'working' || st === 'entertainment' || st === 'error'; };
  const phase = () => {
    const st = S.status || 'idle', now = performance.now();
    if (st === 'error') return 'error';
    if (st === 'paused') return 'paused';
    if (st === 'entertainment') return 'ent';
    if (st === 'working') return now < startUntil ? 'start' : 'work';
    return now < doneUntil ? 'done' : 'idle';
  };
  const live = () => { const p = phase(); return p === 'start' || p === 'work' || p === 'ent' || p === 'done' || p === 'error'; };
  function sizes(){
    if (hasNotch()){
      const w = Math.max(392, NW() + 2 * 96), nh = NH();
      return { rest: { w: NW(), h: nh, r: 11 }, live: { w, h: nh + 56, r: 24 }, hdr: nh + 56, panelW: w, notchMode: true };
    }
    const top = (S.corner || 'top-center') === 'top-center';
    const mini = !!S.compact || S.showStatus === false;
    const rest = { w: mini ? 76 : (top ? 132 : 150), h: S.compact ? 30 : 34 }; rest.r = rest.h / 2;
    const lw = S.compact ? 330 : (S.showStatus === false ? 252 : 440), lh = S.compact ? 52 : 62;
    return { rest, live: { w: lw, h: lh, r: lh / 2 }, hdr: lh, panelW: Math.max(lw, 380), notchMode: false };
  }

  function glyph(key){
    const s = document.createElementNS(NS, 'svg'); s.setAttribute('viewBox','0 0 16 16'); s.setAttribute('aria-hidden','true');
    GLYPHS[key].forEach(([tag, a]) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); s.appendChild(e); });
    return s;
  }
  function buildPlatforms(){
    const box = $('plats'); box.textContent = '';
    ['ninds','pinds'].forEach(id => $(id).textContent = '');
    (S.platforms || []).forEach(p => {
      const sel = p.key === S.platform;
      const b = document.createElement('button'); b.type = 'button'; b.className = 'plat' + (sel ? ' on' : '');
      b.setAttribute('role','radio'); b.setAttribute('aria-checked', sel ? 'true':'false'); b.hidden = !p.on && !sel;
      b.append(glyph(p.key), document.createTextNode(p.label));
      b.addEventListener('click', e => { e.stopPropagation(); send({t:'platform', key:p.key}); });
      box.appendChild(b);
      if (p.on || sel) ['ninds','pinds'].forEach(id => { const i = document.createElement('span'); i.className = 'ind' + (sel ? ' on' : ''); i.title = p.label; i.appendChild(glyph(p.key)); $(id).appendChild(i); });
    });
  }

  /* ---- running time ---- */
  function fmt(ms){
    const s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), r = s % 60, two = n => (n < 10 ? '0' : '') + n;
    return h ? h + ':' + two(m) + ':' + two(r) : two(m) + ':' + two(r);
  }
  function paintTimer(){ const t = S.since ? fmt(Date.now() - S.since) : ''; $('ntimer').textContent = t; $('ptimer').textContent = t; }
  function syncTimer(){
    const show = !!S.since && (live() || expanded) && phase() !== 'done';
    if (!show){ clearInterval(tickTimer); tickTimer = 0; $('ntimer').textContent = ''; $('ptimer').textContent = ''; return; }
    paintTimer(); if (!tickTimer) tickTimer = setInterval(() => { if (!document.hidden) paintTimer(); }, 1000);
  }

  /* ---- layout: the shell morphs; the window follows ---- */
  function reportSize(){
    const r = wrap.getBoundingClientRect(), w = Math.ceil(r.width), h = Math.ceil(r.height), k = w + 'x' + h;
    if (k !== lastSize){ lastSize = k; send({t:'size', w, h}); }
  }
  function layout(){
    const z = sizes(), isLive = live(), p = phase();
    clearTimeout(shrinkTimer);
    const bodyH = body.scrollHeight;
    const target = expanded ? { w: z.panelW, h: z.hdr + bodyH, r: z.notchMode ? 28 : 26 } : (isLive ? z.live : z.rest);
    shell.classList.toggle('nm', z.notchMode); shell.classList.toggle('pill', !z.notchMode);
    shell.classList.toggle('live', isLive && !expanded); shell.classList.toggle('open', expanded);
    wrap.classList.toggle('pill', !z.notchMode);
    shell.dataset.phase = p;
    shell.style.setProperty('--nw', NW() + 'px'); shell.style.setProperty('--nh', NH() + 'px'); shell.style.setProperty('--bh', z.hdr + 'px');
    const maxW = Math.max(target.w, z.live.w, z.rest.w, shell.offsetWidth), maxH = Math.max(target.h, shell.offsetHeight);
    // the window is always at least as big as the shell is during the transition
    wrap.style.width = (maxW + 2 * PAD_X) + 'px'; wrap.style.height = (maxH + PAD_B + (z.notchMode ? 0 : 8)) + 'px';
    shell.style.width = target.w + 'px'; shell.style.height = target.h + 'px';
    shell.style.borderRadius = z.notchMode ? '0 0 ' + target.r + 'px ' + target.r + 'px' : target.r + 'px';
    reportSize();
    if (!expanded){
      shrinkTimer = setTimeout(() => { wrap.style.width = (target.w + 2 * PAD_X) + 'px'; wrap.style.height = (target.h + PAD_B + (z.notchMode ? 0 : 8)) + 'px'; reportSize(); }, reduce.matches ? 0 : 560);
    }
    syncTimer();
  }
  function sweep(){
    if (reduce.matches) return;
    shell.classList.remove('sweep'); void shell.offsetWidth; shell.classList.add('sweep');
    clearTimeout(sweepTimer); sweepTimer = setTimeout(() => shell.classList.remove('sweep'), 1000);
  }
  function setExpanded(on){
    if (expanded === on) return;
    expanded = on;
    ['nchev','pchev'].forEach(id => $(id).setAttribute('aria-expanded', on ? 'true' : 'false'));
    $('nr2').setAttribute('aria-label', on ? 'Collapse Vibe Play' : 'Expand Vibe Play'); $('bar').setAttribute('aria-label', on ? 'Collapse Vibe Play' : 'Expand Vibe Play');
    layout(); scheduleCollapse();
  }

  function apply(s){
    S = s || {};
    const st = S.status || 'idle', active = (st === 'working' || st === 'entertainment');
    const now = performance.now();
    if (active && !prevActive){ startUntil = now + 1100; doneUntil = 0; if (st === 'working') { sweep(); clearTimeout(phaseTimer); phaseTimer = setTimeout(relayout, 1150); } }
    if (!active && prevActive && st === 'idle'){ doneUntil = now + 2800; sweep(); clearTimeout(phaseTimer); phaseTimer = setTimeout(relayout, 2850); }
    if (active && S.agent) lastAgent = S.agent;
    if (st === 'error' || st === 'paused') doneUntil = 0;
    prevActive = active;
    const p = phase();
    const label = p === 'done' ? 'All done' : (S.label || '');
    const sub = p === 'done' ? ((lastAgent || 'The agent') + ' finished') : (S.compact ? '' : (S.detail || ''));
    ['ntitle','ptitle'].forEach(id => $(id).textContent = label); ['nsub','psub'].forEach(id => $(id).textContent = sub);
    $('prest').textContent = st === 'paused' ? 'Paused' : 'Vibe Play';
    $('vAgent').textContent = (S.agent || '—') + (S.terminal ? ' · ' + S.terminal : '');
    $('vStatus').textContent = S.statusText || label; $('vSessions').textContent = String(S.sessions || 0);
    $('sw').setAttribute('aria-checked', S.enabled ? 'true' : 'false');
    if (label !== lastLabel){ lastLabel = label; }
    buildPlatforms();
    if (shell.classList.contains('hide')) requestAnimationFrame(() => shell.classList.remove('hide'));
    layout();
  }
  function relayout(){ layout(); }

  /* ---- interaction: hover reveals, click toggles, leaving collapses unless a control is in use ---- */
  const toggle = () => { clearTimeout(dwellTimer); setExpanded(!expanded); };
  ['nr2','bar'].forEach(id => { $(id).addEventListener('click', toggle); $(id).addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); toggle(); } }); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && expanded) setExpanded(false); });
  $('sw').addEventListener('click', e => { e.stopPropagation(); send({t:'toggle'}); });
  $('settings').addEventListener('click', e => { e.stopPropagation(); send({t:'openSettings'}); });
  document.addEventListener('contextmenu', e => { e.preventDefault(); send({t:'menu'}); });
  function scheduleCollapse(){
    clearTimeout(hoverTimer);
    if (!expanded) return;
    hoverTimer = setTimeout(() => { if (expanded && !pointerIn && !shell.contains(document.activeElement) ) setExpanded(false); else if (expanded && !pointerIn) scheduleCollapse(); }, 520);
  }
  shell.addEventListener('pointerenter', () => {
    pointerIn = true; clearTimeout(hoverTimer); shell.classList.add('hover');
    clearTimeout(dwellTimer); if (!expanded) dwellTimer = setTimeout(() => { if (pointerIn) setExpanded(true); }, 260);
  });
  shell.addEventListener('pointerleave', () => { pointerIn = false; clearTimeout(dwellTimer); shell.classList.remove('hover'); scheduleCollapse(); });

  window.wpWidget = { apply, expand: setExpanded, fadeOut(){ shell.classList.add('hide'); } };
  new ResizeObserver(reportSize).observe(wrap);
  send({t:'ready'});

  if (!window.ipc){
    document.body.classList.add('demo'); $('menubarsim').style.display = 'block';
    const plats = [{key:'instagram',label:'Instagram',on:true},{key:'x',label:'X',on:true},{key:'youtube',label:'YouTube',on:true}];
    const base = {status:'idle', label:'Idle', detail:'Waiting for an agent', agent:'', sessions:0, platform:'instagram', platformLabel:'Instagram', platforms:plats, enabled:true, compact:false, showStatus:true, corner:'top-center', notch:{w:190,h:34}};
    const ago = s => Date.now() - s * 1000;
    const presets = {
      idle: {},
      working: {status:'working', label:'Claude Code is working', detail:'Claude Code · Instagram', agent:'Claude Code', terminal:'Terminal', sessions:1, statusText:'Working', since:ago(134)},
      entertainment: {status:'entertainment', label:'Claude Code is working', detail:'Claude Code · Instagram', agent:'Claude Code', terminal:'Terminal', sessions:1, statusText:'Entertainment open', since:ago(61)},
      error: {status:'error', label:'Needs attention', detail:'Local bridge is not running'},
      paused: {status:'paused', label:'Paused', detail:'Automation is off', enabled:false}
    };
    let cur = Object.assign({}, base);
    const bar = document.createElement('div'); bar.id = 'demo';
    const add = (n, fn) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = n; b.addEventListener('click', fn); bar.appendChild(b); };
    Object.keys(presets).forEach(k => add(k, () => { cur = Object.assign({}, base, presets[k], {notch:cur.notch, corner:cur.corner}); apply(cur); }));
    add('finish', () => { cur = Object.assign({}, base, {notch:cur.notch, corner:cur.corner}); apply(cur); });
    add('notch on/off', () => { cur.notch = cur.notch ? null : {w:190,h:34}; apply(cur); });
    add('dark backdrop', () => document.body.classList.toggle('dark'));
    document.body.appendChild(bar);
    window.ipc = null;
    const q = new URLSearchParams(location.search);
    if (q.get('nonotch')) base.notch = null;
    if (q.get('s') && presets[q.get('s')]) cur = Object.assign({}, base, presets[q.get('s')]);
    if (q.get('dark')) document.body.classList.add('dark');
    cur.notch = q.get('nonotch') ? null : cur.notch;
    apply(cur);
    if (q.get('open')) setExpanded(true);
    $('plats').addEventListener('click', e => { const b = e.target.closest('.plat'); if (b){ cur.platform = (S.platforms||[]).find(p => b.textContent.includes(p.label)).key; apply(cur); } });
    $('sw').addEventListener('click', () => { cur.enabled = !cur.enabled; apply(cur); });
  }
})();
</script>
