<title>Vibe Play Widget</title>
<style>
/* Vibe Play notch (Windows): a near-black pill that hangs at the top centre of the screen, like the Dynamic Island.
   Resting it is a small pill (logo, name, activity bars). While an agent works it widens to show the status, the agent, a running
   timer and which entertainment sites are on; a click opens the panel with the existing controls. The window is transparent and the
   app clips it to the pill (the page reports the pill rectangle over IPC every frame while it moves), so everything around the pill
   is click-through. The pill is opaque, so nothing here depends on Windows' transparency effects. */
:root{
  --bg:#080808; --fg:#ffffff; --fg2:#a0a0a0; --accent:#639085; --accent-soft:rgba(99,144,133,.20); --accent-line:rgba(99,144,133,.55);
  --amber:#b98a3e; --red:#c4574f; --grey:#4a4a4a;
  --line:rgba(255,255,255,.08); --edge:rgba(255,255,255,.07); --chip:#141414; --chip-hover:#1d1d1d;
  --ease:cubic-bezier(.32,.72,0,1); --spring:cubic-bezier(.22,1.2,.36,1);
}
*{box-sizing:border-box}
html,body{margin:0;background:transparent;overflow:hidden;color:var(--fg);
  font:13px "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  user-select:none;-webkit-user-select:none;cursor:default}

#wrap{display:flex;padding:8px;width:166px;height:52px}
#wrap.top{align-items:flex-start} #wrap.bottom{align-items:flex-end}
#wrap.left{justify-content:flex-start} #wrap.right{justify-content:flex-end} #wrap.center{justify-content:center}

#pill{position:relative;flex:none;overflow:hidden;width:150px;height:36px;border-radius:18px;background:var(--bg);color:var(--fg);
  box-shadow:inset 0 0 0 1px var(--edge),inset 0 1px 0 rgba(255,255,255,.04);
  opacity:0;transform:translateY(-6px) scale(.96);
  transition:width .5s var(--ease),height .5s var(--ease),border-radius .5s var(--ease),opacity .25s ease,transform .5s var(--spring)}
#pill.in{opacity:1;transform:none}
#pill.out{opacity:0;transform:scale(.97);transition-duration:.2s}
#pill[data-done=true]{animation:settle .6s var(--spring)}
@keyframes settle{0%{transform:scale(1)}35%{transform:scale(1.035)}100%{transform:scale(1)}}

#bar{position:relative;display:flex;align-items:center;gap:10px;height:var(--bh,36px);padding:0 12px 0 8px;cursor:pointer;
  transition:height .5s var(--ease)}
#pill.live #bar{padding:0 10px 0 14px;gap:12px}

/* logo with its status dot */
#icon{position:relative;width:22px;height:22px;flex:none;transition:width .5s var(--ease),height .5s var(--ease)}
#pill.live #icon{width:34px;height:34px}
#pill.compact #icon{width:22px;height:22px}
#pill.mon #icon{width:28px;height:28px}
#pill.mon.live #icon{width:36px;height:36px}
#pill.mon.live.compact #icon{width:30px;height:30px}
.mch{display:none;position:absolute;inset:0}
#pill.mon .mch{display:block} #pill.mon .lg,#pill.mon #ring{display:none}

#icon svg{width:100%;height:100%;display:block}
#ring{position:absolute;right:-3px;bottom:-3px;width:10px;height:10px;border-radius:50%;background:var(--grey);box-shadow:0 0 0 2px var(--bg);
  display:flex;align-items:center;justify-content:center;transition:background .3s ease}
#ring svg{display:none;width:7px;height:7px;fill:none;stroke:#080808;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#pill[data-status=working] #ring{background:var(--accent);animation:breathe 2.4s ease-in-out infinite}
#pill[data-status=entertainment] #ring{background:var(--accent)}
#pill[data-status=paused] #ring{background:var(--amber)}
#pill[data-status=error] #ring{background:var(--red)}
#pill[data-done=true] #ring{background:var(--accent);animation:none}
#pill[data-done=true] #ring svg{display:block}
@keyframes breathe{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.78);opacity:.65}}

/* resting content */
#restText{font-size:12.5px;font-weight:600;letter-spacing:.01em;white-space:nowrap;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
#pill.mini #restText{display:none}
#act{display:flex;align-items:center;gap:2.5px;height:14px;flex:none}
#act i{display:block;width:2.5px;height:4px;border-radius:2px;background:var(--grey);transition:height .3s ease,background .3s ease}
#pill[data-status=working] #act i{background:var(--accent);animation:eq 1.1s ease-in-out infinite}
#pill[data-status=working] #act i:nth-child(2){animation-delay:.18s}
#pill[data-status=working] #act i:nth-child(3){animation-delay:.36s}
#pill[data-status=paused] #act i{background:var(--amber)}
@keyframes eq{0%,100%{height:4px}50%{height:12px}}
#pill[data-phase=wait] #ring{background:var(--amber);animation:none}
#pill[data-phase=wait] #act i{background:var(--amber)}

/* live content */
#text{display:flex;flex-direction:column;justify-content:center;min-width:0;flex:1;gap:2px}
#text.hide{display:none}
#title{font-size:13.5px;font-weight:600;line-height:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sub{font-size:11.5px;line-height:14px;color:var(--fg2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sub:empty,#pill.compact #sub{display:none}
#text.swap{animation:swap .35s var(--spring)}
@keyframes swap{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
#timer{font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--fg);flex:none;min-width:38px;text-align:right}
#timer:empty{display:none}
#inds{display:flex;gap:5px;flex:none}
.ind{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#6b6b6b;background:var(--chip);
  transition:background .3s ease,color .3s ease,box-shadow .3s ease}
.ind.on{color:var(--fg);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent-line)}
.ind svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ind svg .f{fill:currentColor;stroke:none}
#chev{all:unset;box-sizing:border-box;width:26px;height:26px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  background:var(--chip);color:var(--fg2);cursor:pointer;transition:background .2s ease,color .2s ease,transform .5s var(--spring)}
#chev:hover{background:var(--chip-hover);color:var(--fg)}
#chev svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#pill.open #chev{transform:rotate(180deg)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#bar:focus-visible{outline:2px solid var(--accent);outline-offset:-3px;border-radius:inherit}

/* which parts show in which mode */
#pill.rest #text,#pill.rest #timer,#pill.rest #inds,#pill.rest #chev{display:none}
#pill.live #restText,#pill.live #act{display:none}
#pill.show #bar>*{animation:fadein .32s ease .06s both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
#pill.live.compact #inds{display:none}

/* panel */
#body{position:absolute;left:0;right:0;top:calc(var(--bh,36px) + var(--th,0px));padding:0 18px 16px;opacity:0;pointer-events:none;transition:opacity .2s ease}
#pill.open #body{opacity:1;pointer-events:auto;transition:opacity .3s ease .14s}
.sep{height:1px;background:var(--line);margin:2px 0 10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:26px}
.k{font-size:12px;color:var(--fg2)} .v{font-size:12.5px;font-weight:500;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#plats{display:flex;gap:6px;margin:8px 0 10px}
.plat{all:unset;box-sizing:border-box;flex:1;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:6px;
  background:var(--chip);box-shadow:inset 0 0 0 1px rgba(255,255,255,.05);font-size:12px;font-weight:500;color:var(--fg2);cursor:pointer;
  transition:background .2s ease,color .2s ease,box-shadow .2s ease,transform .2s var(--spring)}
.plat:hover{background:var(--chip-hover);color:var(--fg)} .plat:active{transform:scale(.97)}
.plat.on{background:var(--accent-soft);color:var(--fg);box-shadow:inset 0 0 0 1px var(--accent-line)}
.plat svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.plat svg .f{fill:currentColor;stroke:none}
.plat[hidden]{display:none}
#foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.sw{all:unset;box-sizing:border-box;width:38px;height:22px;border-radius:11px;background:#2a2a2a;position:relative;cursor:pointer;transition:background .25s ease}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .3s var(--spring)}
.sw[aria-checked=true]{background:var(--accent)} .sw[aria-checked=true]::after{transform:translateX(16px)}
.link{all:unset;box-sizing:border-box;font-size:12px;font-weight:500;color:var(--accent);cursor:pointer;padding:4px 8px;border-radius:8px;transition:background .2s ease,color .2s ease}
.link:hover{background:var(--chip);color:var(--fg)}

/* notification: a row under the header, inside the pill */
#toast{position:absolute;left:0;right:0;top:var(--bh,36px);height:var(--th,0px);padding:0 16px;display:flex;align-items:center;gap:10px;opacity:0;pointer-events:none;overflow:hidden;cursor:pointer;
  transition:opacity .25s ease,height .35s var(--ease)}
#pill.hastoast #toast{opacity:1;pointer-events:auto;transition:opacity .3s ease .12s,height .35s var(--ease)}
#toast .td{width:8px;height:8px;border-radius:50%;flex:none;background:var(--accent)}
#toast[data-kind=started] .td,#toast[data-kind=waiting] .td{background:var(--amber)} #toast[data-kind=error] .td{background:var(--red)}
#toast .tx{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1}
#toast b{font-size:12.5px;font-weight:600;line-height:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toast .tx span{font-size:11.5px;line-height:14px;color:var(--fg2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toast .tx span:empty{display:none}
#tClose{all:unset;box-sizing:border-box;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--fg2);cursor:pointer;flex:none}
#tClose:hover{background:var(--chip);color:var(--fg)}
#tClose svg{width:9px;height:9px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round}

/* panel pieces */
#entline{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;min-height:22px;margin-bottom:6px}
.ed{width:8px;height:8px;border-radius:50%;background:var(--grey);align-self:center;flex:none}
#entline[data-state=active] .ed,#entline[data-state=open] .ed{background:var(--accent)} #entline[data-state=opening] .ed,#entline[data-state=closing] .ed{background:var(--amber)} #entline[data-state=paused] .ed{background:var(--amber)}
.et{font-size:12.5px;font-weight:600} .eh{font-size:11.5px;color:var(--fg2)} .eh:empty{display:none}
.shead{font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--fg2);margin:6px 0 4px;text-transform:uppercase}
#sess{display:flex;flex-direction:column;gap:2px;margin-bottom:6px}
.srow{border-radius:10px;padding:5px 8px;cursor:pointer;transition:background .18s ease}
.srow:hover{background:var(--chip)}
.srow .l1{display:flex;align-items:center;gap:8px;min-height:20px}
.sd{width:8px;height:8px;border-radius:50%;flex:none;background:var(--grey)}
.srow[data-act=working] .sd{background:var(--accent)} .srow[data-act=waiting] .sd{background:var(--amber)} .srow[data-act=done] .sd{background:var(--accent);opacity:.6} .srow[data-act=failed] .sd{background:var(--red)}
.sn{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.ss{font-size:11.5px;color:var(--fg2);white-space:nowrap}
.srow[data-act=failed] .ss{color:#e08a84}
.st{font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
.sdet{display:none;font-size:11.5px;color:var(--fg2);padding:3px 0 2px 16px}
.srow.sel .sdet{display:block}
.snone{font-size:12px;color:var(--fg2);padding:4px 8px}
#ctl{display:flex;gap:6px;margin:6px 0 4px}
.cbtn{all:unset;box-sizing:border-box;flex:1;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--chip);box-shadow:inset 0 0 0 1px rgba(255,255,255,.05);
  font-size:12px;font-weight:500;color:var(--fg2);cursor:pointer;transition:background .2s ease,color .2s ease,transform .2s var(--spring)}
.cbtn:hover{background:var(--chip-hover);color:var(--fg)} .cbtn:active{transform:scale(.97)}
.cbtn svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

@media (prefers-reduced-motion: reduce){
  *{transition:none!important;animation:none!important}
}
@media (prefers-contrast: more){
  :root{--fg2:#d0d0d0;--edge:rgba(255,255,255,.4);--accent-line:#8fb5aa}
}

/* demo mode: a page opened in a browser has no desktop behind it */
body.demo{background:linear-gradient(135deg,#d9dde8 0%,#f0e8d8 100%);min-height:100vh;overflow:auto}
body.demo.dark{background:linear-gradient(135deg,#1b2340 0%,#3a2a58 50%,#5a3a45 100%)}
body.demo #wrap{margin:0 auto;width:auto}
#demo{position:fixed;left:12px;bottom:12px;display:flex;flex-wrap:wrap;gap:6px;max-width:560px}
#demo button{font:11px "Segoe UI",system-ui,sans-serif;padding:3px 9px;border-radius:7px;border:0;background:rgba(0,0,0,.75);color:#fff;cursor:pointer}
</style>
</head>
<body>
<div id="wrap" class="top center">
  <div id="pill" class="rest" data-status="idle">
    <div id="bar" role="button" tabindex="0" aria-label="Expand Vibe Play">
      <span id="icon">
        <i class="lg"></i><span class="mch"></span>
        <span id="ring"><svg viewBox="0 0 8 8" aria-hidden="true"><path d="M1.5 4.2 3.3 6 6.5 2"/></svg></span>
      </span>
      <span id="restText">Vibe Play</span>
      <span id="act" aria-hidden="true"><i></i><i></i><i></i></span>
      <span id="text"><span id="title"></span><span id="sub"></span></span>
      <span id="timer" aria-label="Running time"></span>
      <span id="inds" aria-hidden="true"></span>
      <button id="chev" type="button" aria-label="Expand" aria-expanded="false"><svg viewBox="0 0 12 12"><path d="M3 4.5 6 7.5 9 4.5"/></svg></button>
    </div>
    <div id="toast" role="status" aria-live="polite"><span class="td"></span><span class="tx"><b id="tTitle"></b><span id="tBody"></span></span><button id="tClose" type="button" aria-label="Dismiss notification"><svg viewBox="0 0 10 10"><path d="M2 2l6 6M8 2L2 8"/></svg></button></div>
    <div id="body">
      <div class="sep"></div>
      <div id="entline"><span class="ed"></span><span class="et" id="entText"></span><span class="eh" id="entHint"></span></div>
      <div class="shead"><span id="sHead">No active sessions</span></div>
      <div id="sess" role="list"></div>
      <div id="plats" role="radiogroup" aria-label="Entertainment platform"></div>
      <div id="ctl"><button class="cbtn" id="cOpen" type="button"></button><button class="cbtn" id="cMute" type="button"></button></div>
      <div id="foot">
        <span class="row" style="gap:10px"><span class="k">Automation</span><button class="sw" id="sw" type="button" role="switch" aria-checked="true" aria-label="Automation"></button></span>
        <button class="link" id="settings" type="button">Settings…</button>
      </div>
    </div>
  </div>
</div>
<script>/*@MASCOT@*/</script>
<script>
(function(){
  const send = m => window.ipc && window.ipc.postMessage(JSON.stringify(m));
  const $ = id => document.getElementById(id);
  const NS = 'http://www.w3.org/2000/svg';
  const wrap = $('wrap'), pill = $('pill'), text = $('text'), body = $('body');
  const GLYPHS = {
    instagram: [['rect',{x:2,y:2,width:12,height:12,rx:3.5}],['circle',{cx:8,cy:8,r:2.8}],['circle',{cx:11.6,cy:4.4,r:.5}]],
    x: [['path',{d:'M3 3l10 10M13 3L3 13'}]],
    youtube: [['rect',{x:1.5,y:3.5,width:13,height:9,rx:3}],['path',{d:'M6.7 6v4l3.5-2z',class:'f'}]]
  };
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
  let S = {}, expanded = false, lastLabel = null, lastMode = null, lastSize = '', animUntil = 0, raf = 0, shrinkTimer = 0, tickTimer = 0, phaseTimer = 0, selId = '', toastId = 0;
  let prevActive = false, startUntil = 0, doneUntil = 0, lastAgent = '', mc = null, prevRows = {};
  const PAD = 8, PANEL_W = 360, TOAST_H = 46;
  const toastOn = () => !!S.toast;
  const mascotOn = () => !!(S.mascot && S.mascot.on);

  /* rest = a small pill; live = the wide pill while something is happening (a finished run, a problem, entertainment open) */
  const phase = () => {
    const st = S.status || 'idle', now = performance.now();
    if (st === 'error') return 'error';
    if (st === 'paused') return 'paused';
    if ((st === 'working' || st === 'entertainment') && S.statusText === 'Needs you') return 'wait';
    if (st === 'entertainment') return 'ent';
    if (st === 'working') return now < startUntil ? 'start' : 'work';
    return (S.justFinished || now < doneUntil) ? 'done' : 'idle';
  };
  const mode = () => { const p = phase(); return toastOn() || (p !== 'idle' && p !== 'paused') ? 'live' : 'rest'; };
  const mini = () => !!S.compact || S.showStatus === false;
  const REST = () => ({ w: mini() ? 76 : 150, h: S.compact ? 32 : 36 });
  const LIVE = () => ({ w: S.compact ? 330 : (S.showStatus === false ? 252 : 440), h: S.compact ? 52 : 64 });
  const base = () => mode() === 'rest' ? REST() : LIVE();
  const cap = () => { const b = base(); return toastOn() ? { w: b.w, h: b.h + TOAST_H } : b; };
  const barH = () => (expanded ? LIVE() : base()).h;
  const target = () => expanded ? { w: Math.max(LIVE().w, PANEL_W), h: LIVE().h + (toastOn() ? TOAST_H : 0) + body.scrollHeight } : cap();

  function glyph(key){
    const s = document.createElementNS(NS, 'svg'); s.setAttribute('viewBox','0 0 16 16'); s.setAttribute('aria-hidden','true');
    GLYPHS[key].forEach(([tag, a]) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); s.appendChild(e); });
    return s;
  }
  function buildPlatforms(){
    const box = $('plats'); box.textContent = '';
    const inds = $('inds'); inds.textContent = '';
    (S.platforms || []).forEach(p => {
      const sel = p.key === S.platform;
      const b = document.createElement('button'); b.type = 'button'; b.className = 'plat' + (sel ? ' on' : '');
      b.setAttribute('role','radio'); b.setAttribute('aria-checked', sel ? 'true':'false'); b.hidden = !p.on && !sel;
      b.append(glyph(p.key), document.createTextNode(p.label));
      b.addEventListener('click', e => { e.stopPropagation(); send({t:'platform', key:p.key}); });
      box.appendChild(b);
      if (p.on || sel){
        const i = document.createElement('span'); i.className = 'ind' + (sel ? ' on' : ''); i.title = p.label;
        i.appendChild(glyph(p.key)); inds.appendChild(i);
      }
    });
  }

  /* running time: the page counts it itself from the moment the bridge reported (one text update a second, only while it shows) */
  function fmt(ms){
    const s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), r = s % 60;
    const two = n => (n < 10 ? '0' : '') + n;
    return h ? h + ':' + two(m) + ':' + two(r) : two(m) + ':' + two(r);
  }
  function paintTimer(){
    $('timer').textContent = S.since ? fmt(Date.now() - S.since) : '';
    document.querySelectorAll('#sess [data-since]').forEach(e => { e.textContent = fmt(Date.now() - Number(e.dataset.since)); });
  }
  function syncTimer(){
    const show = (!!S.since || !!document.querySelector('#sess [data-since]')) && (mode() === 'live' || expanded) && phase() !== 'done';
    if (!show){ clearInterval(tickTimer); tickTimer = 0; $('timer').textContent = ''; return; }
    paintTimer();
    if (!tickTimer) tickTimer = setInterval(() => { if (!document.hidden) paintTimer(); }, 1000);
  }

  /* geometry: the window follows the pill and the app clips it to the pill's live rectangle during every transition */
  function reportSize(){
    const r = wrap.getBoundingClientRect(), w = Math.ceil(r.width), h = Math.ceil(r.height), k = w + 'x' + h;
    if (k !== lastSize){ lastSize = k; send({t:'size', w, h}); }
  }
  function reportShape(){
    const p = pill.getBoundingClientRect(), w = wrap.getBoundingClientRect();
    send({t:'shape', x:p.left - w.left, y:p.top - w.top, w:p.width, h:p.height, wh:w.height,
          r:parseFloat(getComputedStyle(pill).borderTopLeftRadius) || 0});
  }
  function loop(){ reportShape(); raf = performance.now() < animUntil ? requestAnimationFrame(loop) : 0; }
  function kick(ms){ animUntil = performance.now() + (reduce.matches ? 0 : ms); if (!raf) raf = requestAnimationFrame(loop); }

  function layout(){
    const t = target(), c = cap(), bh = barH(), th = toastOn() ? TOAST_H : 0;
    clearTimeout(shrinkTimer);
    const live = mode() === 'live' || expanded;
    pill.classList.toggle('live', live); pill.classList.toggle('rest', !live);
    pill.classList.toggle('mini', mini());
    pill.classList.toggle('mon', mascotOn()); pill.classList.toggle('hastoast', th > 0);
    pill.dataset.phase = phase();
    pill.style.setProperty('--bh', bh + 'px'); pill.style.setProperty('--th', th + 'px');
    // the window is always at least as big as everything that is on screen during the transition
    const big = { w: Math.max(t.w, expanded ? t.w : pill.offsetWidth, c.w), h: Math.max(t.h, expanded ? t.h : pill.offsetHeight, c.h) };
    wrap.style.width = (big.w + 2 * PAD) + 'px'; wrap.style.height = (big.h + 2 * PAD) + 'px';
    pill.style.width = t.w + 'px'; pill.style.height = t.h + 'px';
    pill.style.borderRadius = (expanded ? 28 : t.h / 2) + 'px';
    reportSize(); kick(700);
    if (!expanded){
      shrinkTimer = setTimeout(() => { wrap.style.width = (t.w + 2 * PAD) + 'px'; wrap.style.height = (t.h + 2 * PAD) + 'px'; reportSize(); reportShape(); }, reduce.matches ? 0 : 560);
    }
    syncTimer(); paintMascot();
  }
  function setExpanded(on){
    expanded = on; pill.classList.toggle('open', on);
    $('chev').setAttribute('aria-expanded', on ? 'true' : 'false'); $('bar').setAttribute('aria-label', on ? 'Collapse Vibe Play' : 'Expand Vibe Play');
    layout(); scheduleCollapse();
  }

  function apply(s){
    S = s || {};
    const st = S.status || 'idle', act = (st === 'working' || st === 'entertainment'), now = performance.now();
    if (act && !prevActive){ startUntil = now + 1100; doneUntil = 0; if (st === 'working'){ clearTimeout(phaseTimer); phaseTimer = setTimeout(relayout, 1150); } }
    if (!act && prevActive && st === 'idle'){ doneUntil = now + 2800; clearTimeout(phaseTimer); phaseTimer = setTimeout(relayout, 2850); }
    if (act && S.agent) lastAgent = S.agent;
    if (st === 'error' || st === 'paused') doneUntil = 0;
    prevActive = act;
    const p = phase();
    const corner = S.corner || 'top-center', [v, h] = corner.split('-');
    wrap.className = v + ' ' + h;
    pill.dataset.status = st;
    pill.dataset.done = p === 'done' ? 'true' : 'false';
    pill.classList.toggle('compact', !!S.compact);
    const label = p === 'done' ? ((S.agent || lastAgent || 'The agent') + ' finished! \u2728') : (S.label || '');
    const ent = S.ent || {};
    const subLive = act && ent.text ? [ent.text, (S.sessions || 0) > 1 ? S.sessions + ' sessions' : ''].filter(Boolean).join(' \u00b7 ') : (S.detail || '');
    $('title').textContent = label;
    $('sub').textContent = p === 'done' ? 'You can get back to your code.' : (S.compact ? '' : subLive);
    $('restText').textContent = st === 'paused' ? 'Paused' : 'Vibe Play';
    text.classList.toggle('hide', S.showStatus === false);
    if (label !== lastLabel){ lastLabel = label; text.classList.remove('swap'); void text.offsetWidth; text.classList.add('swap'); }
    paintToast(); renderSessions(); renderControls(); reactToSessions();
    $('sw').setAttribute('aria-checked', S.enabled ? 'true' : 'false');
    buildPlatforms();
    const m = mode() + (expanded ? '+open' : '');
    if (m !== lastMode){ lastMode = m; pill.classList.remove('show'); void pill.offsetWidth; pill.classList.add('show'); }
    if (!pill.classList.contains('in')) requestAnimationFrame(() => pill.classList.add('in'));
    layout();
  }
  const relayout = () => apply(S);

  /* the companion: a picture of the real state, never a source of it */
  const MSTATE = { idle: 'idle', paused: 'sleep', start: 'starting', work: 'working', ent: 'working', wait: 'waiting', done: 'completed', error: 'error' };
  function mascot(){
    if (!mc && typeof Mascot !== 'undefined') mc = Mascot.mount($('icon').querySelector('.mch'));
    return mc;
  }
  function paintMascot(){
    if (!mascotOn() || !mascot()) return;
    const m = S.mascot;
    mc.configure({ on: true, intensity: m.intensity, idle: m.idle, pointer: m.pointer, reduce: m.reduce });
    mc.set(MSTATE[phase()] || 'idle');
  }
  function reactToSessions(){
    const rows = S.sessionList || [], now = {};
    let finished = 0, failed = 0, active = 0;
    rows.forEach(r => {
      now[r.id] = r.act;
      const was = prevRows[r.id];
      if (r.act === 'working' || r.act === 'waiting') active++;
      if ((was === 'working' || was === 'waiting') && r.act === 'done') finished++;
      if ((was === 'working' || was === 'waiting') && r.act === 'failed') failed++;
    });
    prevRows = now;
    if (!mascotOn() || !mascot()) return;
    // one of several finished: a short cheer, then the character goes back to work; the last one is the 'done' phase
    if (finished && active) mc.celebrate(1700);
    if (failed) mc.flash('error', 3200);
  }

  /* session list, entertainment line, controls */
  const ACT = { working: 'Working', waiting: 'Waiting', done: 'Completed', failed: 'Error' };
  const ICON = {
    open: '<svg viewBox="0 0 14 14"><path d="M5 3H3v8h8V9M8 2h4v4M12 2 6.5 7.5"/></svg>',
    hide: '<svg viewBox="0 0 14 14"><path d="M1.5 7S3.5 3.5 7 3.5 12.5 7 12.5 7 10.5 10.5 7 10.5 1.5 7 1.5 7zM2 12 12 2"/></svg>',
    mute: '<svg viewBox="0 0 14 14"><path d="M2 5.5v3h2.5L8 11V3L4.5 5.5zM10 5l3 4M13 5l-3 4"/></svg>',
    unmute: '<svg viewBox="0 0 14 14"><path d="M2 5.5v3h2.5L8 11V3L4.5 5.5zM10 5c1 .6 1.5 1.2 1.5 2S11 8.4 10 9"/></svg>'
  };
  function renderSessions(){
    const list = S.sessionList || [], box = $('sess');
    const active = list.filter(r => r.act === 'working' || r.act === 'waiting').length;
    $('sHead').textContent = active === 0 ? 'No active sessions' : active === 1 ? '1 active session' : active + ' active sessions';
    box.textContent = '';
    if (!list.length){ const n = document.createElement('div'); n.className = 'snone'; n.textContent = 'Nothing is running right now.'; box.appendChild(n); return; }
    list.slice(0, 5).forEach(r => {
      const row = document.createElement('div'); row.className = 'srow' + (r.id === selId ? ' sel' : ''); row.dataset.act = r.act; row.setAttribute('role', 'listitem');
      const l1 = document.createElement('div'); l1.className = 'l1';
      const d = document.createElement('span'); d.className = 'sd';
      const n = document.createElement('span'); n.className = 'sn'; n.textContent = r.name;
      const st = document.createElement('span'); st.className = 'ss'; st.textContent = (r.act === 'working' && r.since && Date.now() - r.since < 4000) ? 'Starting' : (ACT[r.act] || '');
      const t = document.createElement('span'); t.className = 'st';
      if (r.since && (r.act === 'working' || r.act === 'waiting')){ t.dataset.since = String(r.since); t.textContent = fmt(Date.now() - r.since); }
      else if (r.durMs){ t.textContent = fmt(r.durMs); }
      l1.append(d, n, st, t);
      const det = document.createElement('div'); det.className = 'sdet';
      const when = r.since ? 'Started ' + new Date(r.since).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
      det.textContent = [r.prompt || '', r.terminal ? 'Terminal: ' + r.terminal : '', when].filter(Boolean).join(' \u00b7 ') || 'No more detail from this agent.';
      row.append(l1, det);
      row.addEventListener('click', e => { e.stopPropagation(); selId = selId === r.id ? '' : r.id; renderSessions(); requestAnimationFrame(layout); });
      box.appendChild(row);
    });
    if (list.length > 5){ const m = document.createElement('div'); m.className = 'snone'; m.textContent = '+' + (list.length - 5) + ' more'; box.appendChild(m); }
  }
  function renderControls(){
    const ent = S.ent || {};
    $('entline').dataset.state = ent.state || ''; $('entText').textContent = ent.text || ''; $('entHint').textContent = ent.hint || '';
    const o = $('cOpen'); o.innerHTML = (S.entOpen ? ICON.hide : ICON.open) + '<span></span>';
    o.lastChild.textContent = S.entOpen ? 'Hide' : 'Open ' + (S.platformLabel || ''); o.dataset.a = S.entOpen ? 'hideEntertainment' : 'openEntertainment';
    o.setAttribute('aria-label', S.entOpen ? 'Hide the entertainment window' : 'Open entertainment');
    const m = $('cMute'); m.innerHTML = (S.muted ? ICON.unmute : ICON.mute) + '<span></span>'; m.lastChild.textContent = S.muted ? 'Unmute' : 'Mute';
    m.setAttribute('aria-pressed', S.muted ? 'true' : 'false'); m.setAttribute('aria-label', S.muted ? 'Unmute sounds' : 'Mute sounds');
  }
  function paintToast(){
    const id = S.toast ? S.toast.id : 0;
    if (id === toastId) return;
    toastId = id;
    if (!S.toast) return;
    $('toast').dataset.kind = S.toast.kind; $('tTitle').textContent = S.toast.title; $('tBody').textContent = S.toast.body || '';
  }

  $('bar').addEventListener('click', () => setExpanded(!expanded));
  $('bar').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); setExpanded(!expanded); } });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && expanded) setExpanded(false); });
  $('sw').addEventListener('click', e => { e.stopPropagation(); send({t:'toggle'}); });
  $('cOpen').addEventListener('click', e => { e.stopPropagation(); send({t: e.currentTarget.dataset.a || 'openEntertainment'}); });
  $('cMute').addEventListener('click', e => { e.stopPropagation(); send({t:'toggleMute'}); });
  $('toast').addEventListener('click', () => setExpanded(true));
  $('tClose').addEventListener('click', e => { e.stopPropagation(); send({t:'dismissToast'}); });
  $('settings').addEventListener('click', e => { e.stopPropagation(); send({t:'openSettings'}); });
  document.addEventListener('contextmenu', e => { e.preventDefault(); send({t:'menu'}); });

  /* hover: the panel collapses by itself once the pointer is not over the pill (and is not being dragged) */
  let hoverTimer = 0, dragging = false, downAt = null;
  function scheduleCollapse(){
    clearTimeout(hoverTimer);
    if (!expanded) return;
    hoverTimer = setTimeout(() => { if (expanded && !dragging && !pill.matches(':hover')) setExpanded(false); }, 650);
  }
  pill.addEventListener('pointerenter', () => clearTimeout(hoverTimer));
  pill.addEventListener('pointerleave', scheduleCollapse);
  pill.addEventListener('pointermove', e => {
    if (!mascotOn() || !mascot()) return;
    const r = $('icon').getBoundingClientRect();
    mc.look((e.clientX - (r.left + r.width / 2)) / 160, (e.clientY - (r.top + r.height / 2)) / 120);
  });
  pill.addEventListener('pointerleave', () => { if (mc) mc.look(null); });

  /* drag: press on the pill (not on a control) and move a few pixels, then Windows moves the window; the app remembers where it lands */
  pill.addEventListener('pointerdown', e => {
    if (e.button !== 0 || e.target.closest('#plats,#sw,#settings,.link,#chev,#ctl,#tClose')) return;
    downAt = { x: e.screenX, y: e.screenY };
  });
  let dragAt = 0;
  document.addEventListener('pointermove', e => {
    if (dragging){ if (performance.now() - dragAt > 400){ dragging = false; scheduleCollapse(); } return; }   // the native move loop ended: pointer events resume
    if (!downAt || !(e.buttons & 1)) return;
    if (Math.abs(e.screenX - downAt.x) + Math.abs(e.screenY - downAt.y) > 5){ downAt = null; dragging = true; dragAt = performance.now(); clearTimeout(hoverTimer); send({t:'drag'}); }
  });
  document.addEventListener('pointerup', () => { downAt = null; });
  new ResizeObserver(() => { reportSize(); }).observe(wrap);

  window.wpWidget = { apply, expand: setExpanded, fadeOut(){ pill.classList.remove('in'); pill.classList.add('out'); } };
  send({t:'ready'});

  if (!window.ipc){
    document.body.classList.add('demo');
    const plats = on => [{key:'instagram',label:'Instagram',on:true},{key:'x',label:'X',on:on},{key:'youtube',label:'YouTube',on:true}];
    const base = {status:'idle', label:'Idle', detail:'Waiting for an agent', agent:'', sessions:0, platform:'instagram', platformLabel:'Instagram',
                  platforms:plats(true), ent:{state:'waiting',text:'Waiting for an agent',hint:''}, entOpen:false, muted:false,
                  mascot:{on:true,intensity:'subtle',idle:true,pointer:true,reduce:false}, sessionList:[],
                  enabled:true, compact:false, showStatus:true, corner:'top-center'};
    const ago = s => Date.now() - s * 1000;
    const presets = {
      idle: {},
      working: {status:'working', label:'Claude Code is working', detail:'Claude Code · Instagram', agent:'Claude Code', terminal:'Windows Terminal', sessions:1, statusText:'Working', since:ago(134), ent:{state:'hidden',text:'Entertainment hidden',hint:'Open it from here any time.'}, sessionList:[{id:'a',name:'Claude Code',act:'working',since:ago(134),terminal:'Windows Terminal'}]},
      entertainment: {status:'entertainment', label:'Claude Code is working', detail:'Claude Code · Instagram', agent:'Claude Code', terminal:'Windows Terminal', sessions:1, statusText:'Entertainment open', since:ago(61), entOpen:true, ent:{state:'active',text:'Instagram active',hint:'Closes when the session finishes.'}, sessionList:[{id:'a',name:'Claude Code',act:'working',since:ago(61),terminal:'Windows Terminal'}]},
      multi: {status:'entertainment', label:'3 agents working', detail:'Claude Code, Cursor, Codex', agent:'Claude Code', terminal:'Windows Terminal', sessions:3, platform:'youtube', platformLabel:'YouTube', statusText:'Working', since:ago(272), entOpen:true, ent:{state:'active',text:'YouTube active',hint:'Stays open until every session finishes.'}, sessionList:[{id:'a',name:'Claude Code',act:'working',since:ago(272),terminal:'Windows Terminal'},{id:'b',name:'Cursor',act:'waiting',since:ago(138),terminal:'Cursor'},{id:'c',name:'Codex',act:'working',since:ago(106),terminal:'PowerShell'},{id:'d',name:'OpenCode',act:'done',durMs:95000}]},
      waiting: {status:'working', label:'Cursor needs you', detail:'Cursor · Instagram', agent:'Cursor', terminal:'Cursor', sessions:1, statusText:'Needs you', since:ago(40), sessionList:[{id:'b',name:'Cursor',act:'waiting',since:ago(40),terminal:'Cursor'}]},
      done: {status:'idle', label:'Claude Code finished', detail:'Claude Code finished', justFinished:true, agent:'Claude Code', statusText:'Finished'},
      paused: {status:'paused', label:'Paused', detail:'Automation is off', enabled:false},
      error: {status:'error', label:'Needs attention', detail:'Local bridge is not running'}
    };
    let cur = Object.assign({}, base);
    const bar = document.createElement('div'); bar.id = 'demo';
    const add = (name, fn) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = name; b.addEventListener('click', fn); bar.appendChild(b); };
    Object.keys(presets).forEach(k => add(k, () => { cur = Object.assign({}, base, presets[k], {compact:cur.compact, showStatus:cur.showStatus, corner:cur.corner, platform:presets[k].platform || cur.platform}); apply(cur); }));
    let tn = 0, tt = 0;
    const toast = (kind, title, body) => add('toast: ' + kind, () => { cur = Object.assign({}, cur, {toast:{id:++tn, kind, title, body}}); apply(cur); clearTimeout(tt); tt = setTimeout(() => { cur = Object.assign({}, cur, {toast:null}); apply(cur); }, 4500); });
    toast('started', 'Claude Code started working.', 'Instagram is opening.');
    toast('done', 'Claude Code completed.', 'Cursor is still working. Instagram stays open.');
    toast('alldone', 'All coding sessions completed.', 'Your entertainment window is closing.');
    toast('error', 'Claude Code encountered an error.', 'Check your coding session.');
    add('finish', () => { cur = Object.assign({}, base, {compact:cur.compact, showStatus:cur.showStatus, corner:cur.corner}); apply(cur); });
    add('compact', () => { cur.compact = !cur.compact; apply(cur); });
    add('no status text', () => { cur.showStatus = !cur.showStatus; apply(cur); });
    add('dark backdrop', () => document.body.classList.toggle('dark'));
    document.body.appendChild(bar);
    // in the demo the buttons inside the panel act locally
    window.ipc = null;
    const q = new URLSearchParams(location.search);
    if (q.get('s') && presets[q.get('s')]) cur = Object.assign({}, base, presets[q.get('s')]);
    if (q.get('compact')) cur.compact = true;
    if (q.get('dark')) document.body.classList.add('dark');
    apply(cur);
    if (q.get('open')) setExpanded(true);
    $('plats').addEventListener('click', e => { const b = e.target.closest('.plat'); if (b){ cur.platform = (S.platforms||[]).find(p => b.textContent.includes(p.label)).key; apply(cur); } });
    $('sw').addEventListener('click', () => { cur.enabled = !cur.enabled; apply(cur); });
  }
})();
</script>
</body>
</html>
