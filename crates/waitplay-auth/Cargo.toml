[package]
name = "waitplay-auth"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Vibe Play account sign-in (Supabase Auth): PKCE, loopback callback, OS-protected session storage, offline-safe session manager"

[dependencies]
waitplay-core.workspace = true
serde.workspace = true
serde_json.workspace = true
# HTTPS to Supabase (rustls); the rest of the workspace only talks to loopback
ureq = { workspace = true, features = ["tls"] }
sha2 = "0.10"
getrandom = "0.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
