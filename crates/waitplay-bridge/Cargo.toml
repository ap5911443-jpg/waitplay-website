[package]
name = "waitplay-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Vibe Play local companion bridge (HTTP + WebSocket on loopback) and the static web server for the companion UI"

[lib]
name = "waitplay_bridge"
path = "src/lib.rs"

[[bin]]
name = "waitplay-bridge"
path = "src/main.rs"

[dependencies]
waitplay-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util", "fs"] }
hyper = { version = "1", default-features = false, features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "0.26"
getrandom = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["handshake", "connect"] }
