<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vibe Play for macOS: interactive demo</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0c0c12;color:#e8e8ee;font:14px -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
#app{display:flex;min-height:100%;gap:18px;padding:18px;align-items:flex-start;justify-content:center}
#stageWrap{position:sticky;top:18px;flex:none;overflow:clip;border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.08)}
#stage{position:absolute;left:0;top:0;width:1440px;height:900px;transform-origin:0 0;overflow:clip;color:var(--fg);user-select:none;-webkit-user-select:none;cursor:default}
#stage.mac{font:13px -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif}
#stage.win{font:13px "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif}
#stage.light{--fg:#1d1d1f;--bar:rgba(255,255,255,.42);--barfg:#1d1d1f;--menu:rgba(246,246,248,.82);--menufg:#1d1d1f;--winbg:#f5f5f7;--tb:#ececee;--sep:rgba(0,0,0,.12);--dockbg:rgba(255,255,255,.34);--termbg:#fdfdfd;--termfg:#1d1d1f;--termdim:#6e6e73;--site:#fff;--sitefg:#1d1d1f;--sitecard:#f2f2f5}
#stage.dark{--fg:#f5f5f7;--bar:rgba(30,30,34,.42);--barfg:#f5f5f7;--menu:rgba(40,40,44,.84);--menufg:#f5f5f7;--winbg:#1e1e1e;--tb:#2b2b2d;--sep:rgba(255,255,255,.14);--dockbg:rgba(40,40,46,.4);--termbg:#101012;--termfg:#e8e8ee;--termdim:#8e8e93;--site:#111114;--sitefg:#f5f5f7;--sitecard:#1c1c20}
#stage.win.light{--winbg:#f3f3f3;--tb:#f3f3f3;--termbg:#0c0c0c;--termfg:#cccccc;--termdim:#767676}
#stage.win.dark{--winbg:#202020;--tb:#202020;--termbg:#0c0c0c;--termfg:#cccccc;--termdim:#767676}
#wall{position:absolute;inset:0;transition:background .5s}
.mac.light #wall{background:radial-gradient(900px 620px at 18% 8%,#ffd6a5 0,transparent 62%),radial-gradient(900px 700px at 88% 22%,#a9c7ff 0,transparent 58%),radial-gradient(1100px 760px at 55% 108%,#d9b8ff 0,transparent 62%),radial-gradient(700px 500px at 5% 95%,#ffc2d6 0,transparent 60%),#f1e8e0}
.mac.dark #wall{background:radial-gradient(900px 620px at 18% 8%,#3b2a63 0,transparent 62%),radial-gradient(900px 700px at 88% 22%,#1d3f7a 0,transparent 58%),radial-gradient(1100px 760px at 55% 108%,#5b2a6e 0,transparent 62%),radial-gradient(700px 500px at 5% 95%,#12324a 0,transparent 60%),#0d0e1a}
.win.light #wall{background:radial-gradient(800px 560px at 50% 45%,#5fa8ff 0,transparent 60%),radial-gradient(700px 600px at 20% 80%,#c58bff 0,transparent 60%),radial-gradient(700px 520px at 85% 20%,#7de0ff 0,transparent 60%),#dfeaff}
.win.dark #wall{background:radial-gradient(800px 560px at 50% 45%,#1d4f9c 0,transparent 60%),radial-gradient(700px 600px at 20% 80%,#5b2a8e 0,transparent 60%),radial-gradient(700px 520px at 85% 20%,#0f6f8f 0,transparent 60%),#0a1224}

/* macOS menu bar / Windows taskbar */
#menubar{position:absolute;left:0;right:0;top:0;height:28px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;color:var(--barfg);
  background:var(--bar);backdrop-filter:blur(30px) saturate(1.8);-webkit-backdrop-filter:blur(30px) saturate(1.8);z-index:900;font-size:13px}
#menubar .l,#menubar .r{display:flex;align-items:center;gap:18px}
#menubar b{font-weight:700}
#menubar .gem{width:14px;height:14px;border-radius:5px;background:linear-gradient(135deg,#8b92ff,#4046e0);display:inline-block}
.mi{display:flex;align-items:center;height:22px;padding:0 6px;border-radius:5px}
.win #menubar,.mac #taskbar{display:none}
#taskbar{position:absolute;left:0;right:0;bottom:0;height:48px;display:flex;align-items:center;justify-content:center;background:rgba(243,243,243,.78);backdrop-filter:blur(30px) saturate(1.6);-webkit-backdrop-filter:blur(30px) saturate(1.6);border-top:1px solid rgba(0,0,0,.08);z-index:900}
.dark #taskbar{background:rgba(32,32,32,.8);border-top-color:rgba(255,255,255,.08)}
#taskbar .tc{display:flex;gap:4px;align-items:center}
.tbi{width:40px;height:40px;border-radius:6px;display:grid;place-items:center;position:relative;font-size:18px;color:#fff}
.tbi:hover{background:rgba(120,120,128,.2)}
.tbi i{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-style:normal;font-size:14px;color:#fff}
.tbi.run:after{content:"";position:absolute;bottom:2px;left:50%;margin-left:-6px;width:12px;height:3px;border-radius:2px;background:#808080}
.tbi.act:after{background:#0a60ff;width:16px;margin-left:-8px}
#taskbar .tr{position:absolute;right:8px;top:0;bottom:0;display:flex;align-items:center;gap:4px;color:var(--fg);font-size:12px}
#taskbar .ti{height:36px;padding:0 8px;display:flex;align-items:center;border-radius:6px}
#taskbar .ti:hover{background:rgba(120,120,128,.2)}
#clock2{text-align:right;line-height:1.25;font-size:11.5px}
.start{width:22px;height:22px;display:grid;grid-template-columns:1fr 1fr;gap:2px}.start b{background:#0a78d7;border-radius:1px}
#wpItem,#wpTray{cursor:pointer;position:relative}
#wpItem.open,#wpTray.open{background:rgba(120,120,128,.35)}
#wpItem svg,#wpTray svg{width:16px;height:16px}
.dotk{position:absolute;right:3px;bottom:5px;width:6px;height:6px;border-radius:50%;background:#8e8e93}
[data-s=working] .dotk{background:#0a84ff;animation:pulse 1.4s ease-in-out infinite}
[data-s=entertainment] .dotk{background:#30d158}[data-s=paused] .dotk{background:#ff9f0a}[data-s=error] .dotk{background:#ff453a}
@keyframes pulse{50%{opacity:.35}}
.menu{position:absolute;min-width:250px;padding:5px;border-radius:10px;background:var(--menu);color:var(--menufg);backdrop-filter:blur(40px) saturate(1.8);-webkit-backdrop-filter:blur(40px) saturate(1.8);
  box-shadow:0 12px 40px rgba(0,0,0,.35),0 0 0 .5px rgba(0,0,0,.3);z-index:950;font-size:13px}
.win .menu{border-radius:8px;box-shadow:0 12px 40px rgba(0,0,0,.35),0 0 0 1px rgba(128,128,128,.25)}
.menu .it{display:flex;align-items:center;gap:6px;height:22px;padding:0 10px 0 22px;border-radius:5px;position:relative;white-space:nowrap}
.win .menu .it{height:30px;border-radius:4px}
.menu .it.on{cursor:pointer}
.menu .it.on:hover,.menu .it.on.hov{background:#0a60ff;color:#fff}
.win .menu .it.on:hover,.win .menu .it.on.hov{background:rgba(120,120,128,.24);color:inherit}
.menu .it.dis{opacity:.55}
.menu .it .ck{position:absolute;left:7px;font-size:11px}
.menu .it .ar{margin-left:auto;padding-left:18px;opacity:.7}
.menu .sep{height:1px;background:var(--sep);margin:5px 8px}
.menu .sub{position:absolute;left:100%;top:-5px;margin-left:2px;display:none}
.win .menu .sub{left:auto;right:100%;margin:0 2px 0 0}
.menu .it:hover>.sub,.menu .it.hov>.sub{display:block}

/* windows */
.winw{position:absolute;border-radius:12px;overflow:clip;background:var(--winbg);box-shadow:0 24px 70px rgba(0,0,0,.38),0 0 0 .5px rgba(0,0,0,.4),inset 0 0 0 .5px rgba(255,255,255,.12);
  transition:opacity .25s ease,transform .35s cubic-bezier(.22,1.12,.36,1)}
.win .winw{border-radius:8px;box-shadow:0 24px 60px rgba(0,0,0,.4),0 0 0 1px rgba(128,128,128,.35)}
.winw.hide{opacity:0;transform:scale(.94);pointer-events:none}
.winw .tl{position:absolute;left:14px;top:9px;display:flex;gap:8px;z-index:8}
.winw .tl i{width:12px;height:12px;border-radius:50%;display:block;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.25);cursor:pointer}
.tl i:nth-child(1){background:#ff5f57}.tl i:nth-child(2){background:#febc2e}.tl i:nth-child(3){background:#28c840}
.tb{height:30px;background:var(--tb);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--fg);border-bottom:.5px solid var(--sep)}
.win .tb{height:32px;justify-content:flex-start;padding-left:12px;font-weight:400;font-size:12px;border-bottom:0}
.wc{position:absolute;right:0;top:0;height:32px;display:flex;z-index:8}
.wc i{width:46px;height:32px;display:grid;place-items:center;font-style:normal;font-size:12px;cursor:pointer;color:var(--fg)}
.wc i:hover{background:rgba(120,120,128,.22)}.wc i:last-child:hover{background:#c42b1c;color:#fff}
.winw iframe{border:0;display:block;background:transparent}

/* terminal */
#term .body{background:var(--termbg);color:var(--termfg);position:absolute;left:0;right:0;bottom:0;top:30px;padding:12px 14px;overflow:auto;font:12.5px/1.5 "SF Mono",Menlo,"Cascadia Mono",Consolas,monospace;user-select:text;-webkit-user-select:text}
.win #term .body{top:32px}
#term .ln{white-space:pre-wrap;word-break:break-word}
#term .dim{color:var(--termdim)}
#term .ok{color:#30b050}#term .acc{color:#bf5af2}#term .warn{color:#e58f00}
#term .box{border:1px solid #d97757;border-radius:6px;padding:6px 10px;margin:4px 0 8px;color:#d97757}
#term .prompt{display:flex;gap:8px;align-items:center;margin-top:6px}
#term .prompt input{flex:1;background:transparent;border:0;outline:0;color:inherit;font:inherit;user-select:text;-webkit-user-select:text}
#term .perm{margin:8px 0;padding:8px 10px;border:1px solid var(--sep);border-radius:8px}
#term .perm button{margin:6px 8px 0 0;padding:3px 12px;border-radius:6px;border:1px solid var(--sep);background:transparent}
#term .perm button.p{background:#0a60ff;border-color:#0a60ff;color:#fff}
.spin{display:inline-block;animation:sp 1s steps(8) infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#other .body{position:absolute;inset:30px 0 0 0;padding:18px;background:var(--site);color:var(--sitefg);font-size:14px;line-height:1.6}
.win #other .body{top:32px}

/* entertainment window */
#ent .titlebar{height:28px;background:var(--tb);border-bottom:.5px solid var(--sep);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.win #ent{background:rgba(18,18,24,.58);backdrop-filter:blur(28px) saturate(1.7);-webkit-backdrop-filter:blur(28px) saturate(1.7);box-shadow:0 24px 70px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.14)}
#ent .site{position:absolute;left:0;right:0;bottom:0;overflow:auto;background:var(--site);color:var(--sitefg);user-select:none}
.win #ent .site{left:6px;right:6px;bottom:6px;border-radius:6px}
#ent .col{max-width:520px;margin:0 auto}
.sc-h{padding:10px 14px;font-weight:700;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.stories{display:flex;gap:12px;padding:6px 14px 12px}
.story{width:58px;text-align:center;font-size:10.5px}
.story i{display:block;width:54px;height:54px;border-radius:50%;margin:0 auto 4px;border:2px solid #d62976;padding:2px;background-clip:content-box}
.reel{margin:0 14px 14px;border-radius:14px;height:360px;position:relative;overflow:hidden;background:linear-gradient(160deg,#ff9a5a,#d62976 45%,#4f5bd5);background-size:200% 200%;animation:drift 8s ease-in-out infinite}
@keyframes drift{50%{background-position:100% 100%}}
.reel .cap{position:absolute;left:12px;bottom:12px;right:60px;color:#fff;font-size:13px;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.reel .act{position:absolute;right:12px;bottom:14px;display:flex;flex-direction:column;gap:14px;color:#fff;font-size:11px;text-align:center}
.vid{margin:0 14px 14px}
.vid .th{height:170px;border-radius:12px;background:linear-gradient(135deg,#1e3c72,#2a5298 50%,#7e57c2);position:relative;overflow:hidden}
.vid .th:after{content:"";position:absolute;left:50%;top:50%;width:46px;height:32px;margin:-16px 0 0 -23px;border-radius:9px;background:rgba(255,0,0,.9)}
.vid .th i{position:absolute;z-index:2;left:50%;top:50%;margin:-8px 0 0 -4px;border-left:13px solid #fff;border-top:8px solid transparent;border-bottom:8px solid transparent}
.vid b{display:block;margin:8px 2px 2px;font-size:13.5px}.vid span{font-size:12px;opacity:.65}
.post{display:flex;gap:10px;padding:12px 14px;border-bottom:.5px solid var(--sep)}
.post .av{width:38px;height:38px;border-radius:50%;flex:none}
.post b{font-size:13.5px}.post p{margin:3px 0 6px;font-size:13.5px;line-height:1.4}.post small{opacity:.6}
.demo-note{margin:6px 14px 18px;font-size:10.5px;opacity:.5;text-align:center}

/* widget */
#widgetWin{position:absolute;z-index:940}
#glass{position:absolute;backdrop-filter:blur(26px) saturate(1.9);-webkit-backdrop-filter:blur(26px) saturate(1.9);background:rgba(255,255,255,.10)}
.dark #glass{background:rgba(30,30,34,.18)}
.win #glass{display:none}
#widgetFrame{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent}

/* dock */
#dock{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:10px;padding:8px 12px;border-radius:22px;background:var(--dockbg);
  backdrop-filter:blur(30px) saturate(1.8);-webkit-backdrop-filter:blur(30px) saturate(1.8);box-shadow:0 0 0 .5px rgba(255,255,255,.4),0 10px 30px rgba(0,0,0,.25);z-index:600}
.win #dock{display:none}
.dk{width:56px;height:56px;border-radius:13px;display:grid;place-items:center;color:#fff;font-size:26px;position:relative;transition:transform .18s}
.dk:hover{transform:translateY(-8px) scale(1.18)}
.dk.run:after{content:"";position:absolute;bottom:-6px;left:50%;margin-left:-2px;width:4px;height:4px;border-radius:50%;background:var(--fg);opacity:.7}

/* notification */
#notif{position:absolute;right:14px;top:40px;width:340px;padding:12px 14px;border-radius:16px;background:var(--menu);color:var(--menufg);backdrop-filter:blur(30px) saturate(1.8);-webkit-backdrop-filter:blur(30px) saturate(1.8);
  box-shadow:0 10px 36px rgba(0,0,0,.3),0 0 0 .5px rgba(0,0,0,.25);z-index:980;transform:translateX(380px);transition:transform .45s cubic-bezier(.22,1.12,.36,1);display:flex;gap:10px}
.win #notif{top:auto;bottom:62px;border-radius:8px}

#notif b{display:block;font-size:13px}#notif span{font-size:12px;opacity:.75}
#toast{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);padding:22px 28px;border-radius:16px;background:var(--menu);color:var(--menufg);text-align:center;z-index:990;display:none;backdrop-filter:blur(30px);box-shadow:0 12px 40px rgba(0,0,0,.35)}
#toast button{margin-top:12px;padding:6px 16px;border-radius:8px;border:0;background:#0a60ff;color:#fff}
#fsv{position:absolute;inset:0;background:#000;z-index:990;display:none;color:#fff}
#fsv .scr{position:absolute;inset:0;background:linear-gradient(135deg,#0f2027,#203a43 40%,#2c5364);animation:drift 9s ease-in-out infinite;background-size:200% 200%}
#fsv .t{position:absolute;left:40px;bottom:36px;font-size:18px}#fsv .x{position:absolute;right:24px;top:20px;padding:6px 14px;border-radius:8px;border:1px solid rgba(255,255,255,.4);background:rgba(0,0,0,.4);color:#fff}

/* control panel */
#panel{width:330px;flex:none;display:flex;flex-direction:column;gap:14px}
#panel h1{font-size:19px;margin:0;letter-spacing:-.3px}
#panel .sub{font-size:12.5px;opacity:.65;line-height:1.5;margin:4px 0 0}
.card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:12px 14px}
.card h2{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.55;margin:0 0 9px;font-weight:600}
.btn{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:9px 11px;margin:0 0 7px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.07);transition:background .15s}
.btn:hover{background:rgba(255,255,255,.13)}.btn:last-child{margin-bottom:0}
.btn b{font-weight:600;font-size:13px}.btn span{display:block;font-size:11.5px;opacity:.6;margin-top:1px;font-weight:400}
.btn.main{background:linear-gradient(135deg,#5b61f0,#4046e0);border-color:transparent}
.btn .n{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:11px;flex:none;font-style:normal}
.btn.done .n{background:#30d158;color:#04230d}
.seg{display:flex;background:rgba(255,255,255,.08);border-radius:9px;padding:2px;margin-bottom:8px}
.seg button{flex:1;border:0;background:transparent;padding:6px 4px;border-radius:7px;font-size:12px}
.seg button.on{background:rgba(255,255,255,.2)}
.fine{font-size:11.5px;line-height:1.5;opacity:.6}
.os{display:flex;gap:8px;font-size:12px}.os a{color:#9db4ff;text-decoration:none}
@media (max-width:1000px){#app{flex-direction:column;align-items:center}#panel{width:100%;max-width:760px}}
</style>

  <aside id="panel">
    <div><h1 id="pTitle"></h1><p class="sub" id="pSub"></p><p class="os" id="osLinks"></p></div>
    <div class="card"><h2>Try the story</h2>
      <button class="btn main" data-step="prompt"><i class="n">1</i><div><b>Send a prompt to Claude Code</b><span>The agent starts: the widget wakes, entertainment opens, then it all hides when the agent finishes.</span></div></button>
      <button class="btn" data-step="second"><i class="n">2</i><div><b>Start a second agent</b><span>Codex joins: "2 agents working".</span></div></button>
      <button class="btn" data-step="needs"><i class="n">3</i><div><b>An agent needs your input</b><span>Banner, widget and the entertainment header all say so.</span></div></button>
      <button class="btn" data-step="finish"><i class="n">4</i><div><b>Finish everything now</b><span>Shows "All done" and hides the entertainment window.</span></div></button>
      <button class="btn" data-step="bridge"><i class="n">5</i><div><b>Break the local bridge</b><span>The error state and its message.</span></div></button>
    </div>
    <div class="card"><h2>Step away and come back</h2>
      <button class="btn" data-step="minterm"><i class="n">&#9662;</i><div><b id="minTermB">Minimize the Terminal</b><span>The entertainment window steps aside; restore the Terminal and it returns while the agent still works.</span></div></button>
      <button class="btn" data-step="other"><i class="n">&#8644;</i><div><b>Switch to another app</b><span>Same: it hides while you are elsewhere and returns when you are back in the Terminal.</span></div></button>
      <button class="btn" data-step="backterm"><i class="n">&#8617;</i><div><b>Back to the Terminal</b></div></button>
      <button class="btn" data-step="fullscreen" id="fsBtn"><i class="n">&#9974;</i><div><b>Watch a fullscreen video</b><span>The notch gets out of the way of fullscreen apps.</span></div></button>
    </div>
    <div class="card"><h2>Look around</h2>
      <button class="btn" data-step="menu"><i class="n">&#9656;</i><div><b id="menuB">Open the menu</b><span>Status, automation, agents, platform, widget, account, settings.</span></div></button>
      <button class="btn" data-step="expand"><i class="n">&#9656;</i><div><b>Expand the floating widget</b><span>Or click it yourself. Right-click for the same menu.</span></div></button>
      <button class="btn" data-step="settings"><i class="n">&#9656;</i><div><b>Open Settings</b><span>General, Entertainment, AI Agents, Widget, Shortcuts, Permissions, About.</span></div></button>
      <button class="btn" data-step="account"><i class="n">&#9656;</i><div><b>Open Account</b><span>Sign in with any email or "Continue with Google".</span></div></button>
      <button class="btn" data-step="ent"><i class="n">&#9656;</i><div><b>Open entertainment now</b><span>Switch between Instagram, YouTube and X in the header.</span></div></button>
    </div>

centage>\";inherits:true;initial-value:0%}\n@property --c{syntax:\"<color>\";inherits:true;initial-value:rgba(255,255,255,.07)}\n:root{\n  --bg:#000; --fg:#fff; --fg2:rgba(235,235,245,.62); --accent:#2fd28b; --line:rgba(255,255,255,.09); --chip:rgba(255,255,255,.08); --chip-hover:rgba(255,255,255,.14);\n  --ease:cubic-bezier(.32,.72,0,1); --spring:cubic-bezier(.22,1.15,.36,1);\n  --c:rgba(255,255,255,.07); --base:rgba(255,255,255,.05); --glow:0;\n}\n*{box-sizing:border-box}\nhtml,body{margin:0;background:transparent;overflow:hidden;color:var(--fg);\n  font:500 12.5px \"Figtree\",-apple-system,BlinkMacSystemFont,\"SF Pro Text\",system-ui,sans-serif;-webkit-font-smoothing:antialiased;\n  user-select:none;-webkit-user-select:none;cursor:default}\n\n#wrap{display:flex;justify-content:center;align-items:flex-start;padding:0 24px 26px;width:auto}\n#wrap.pill{padding-top:8px}\n#shell{position:relative;flex:none;width:200px;height:34px;border-radius:0 0 11px 11px;\n  transition:width .5s var(--ease),height .5s var(--ease),border-radius .5s var(--ease),--c .6s ease,opacity .25s ease,transform .5s var(--spring)}\n#shell.hide{opacity:0}\n#shell.pill{border-radius:16px}\n\n/* edge light: a thin ring plus a soft glow, both clipped so the top edge (the display's own edge) stays dark */\n#rim,#glow{position:absolute;pointer-events:none;border-radius:inherit;\n  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);\n  background:\n    linear-gradient(90deg,transparent calc(50% - var(--s) - 16%),var(--c) calc(50% - var(--s)),transparent calc(50% - var(--s) + 16%)),\n    linear-gradient(90deg,transparent calc(50% + var(--s) - 16%),var(--c) calc(50% + var(--s)),transparent calc(50% + var(--s) + 16%)),\n    linear-gradient(var(--base),var(--base));\n  transition:opacity .4s ease}\n#rim{inset:0;padding:1.25px;opacity:1}\n#glow{inset:-5px;padding:6px;filter:blur     { id: 'notif', title: 'Notifications', why: 'Shows a banner when an agent needs your input.', affects: 'alerts when agents finish.', state: 'granted', canOpen: true, pane: 'Notifications' },
    { id: 'auto', title: 'Automation', why: 'Not needed for the current setup.', affects: '', state: 'notRequired', canOpen: false, pane: '' }];
  return [
    { id: 'startupApps', title: 'Startup apps', why: 'Lets Vibe Play start by itself when you sign in to Windows.', affects: 'Launch at login. If you switch Vibe Play off under Startup apps in Windows Settings, it will not start automatically.', state: S.settings.launchAtLogin ? 'unknown' : 'notRequired', canOpen: true, pane: 'startupApps' },
    { id: 'input', title: 'Keyboard and mouse', why: 'Vibe Play does not record what you type. While the entertainment window is open it only notices that you are typing or scrolling in the terminal that started the agent, so it can step aside.', affects: 'Nothing is stored or sent anywhere.', state: 'notRequired', canOpen: false, pane: '' },
    { id: 'screenCapture', title: 'Screen capture', why: 'Vibe Play never captures your screen, so it does not ask for this.', affects: 'Nothing.', state: 'notRequired', canOpen: false, pane: '' },
    { id: 'network', title: 'Network', why: 'Coding agents report to Vibe Play over 127.0.0.1, inside your PC. The entertainment sites use your normal internet connection.', affects: 'Nothing leaves your PC except the sites you open.', state: 'notRequired', canOpen: false, pane: '' }];
}
function runtimeState(){
  const st = overall();
  const agents = Object.keys(AGENT_NAMES).map(id => { const r = agentRows().find(a => a.id === id), s = S.integrations[id];
    const det = s !== 'missing', mk = id === 'claude-code' ? { state: s === 'configured' ? 'configured' : 'notConfigured', detail: s === 'configured' ? 'Hooks installed in ' + (IS_WIN ? '%USERPROFILE%\\.claude\\settings.json' : '~/.claude/settings.json') : 'Hooks are not installed yet.', canInstall: true, howTo: '' } :
      id === 'cursor' ? { state: 'notConfigured', detail: IS_WIN ? 'Cursor was not found on this PC.' : 'Not installed on this Mac.', canInstall: false, howTo: '' } :
      { state: s === 'configured' ? 'configured' : 'notConfigured', detail: s === 'configured' ? 'Vibe Play watches this agent while automation is on.' : 'The watcher is off.', canInstall: true, howTo: '' };
    return { id, name: AGENT_NAMES[id], detected: det, activity: r ? r.activity : 'idle', integration: mk }; });
  return { enabled: S.enabled, status: st, bridge: { connected: S.bridgeOk }, sessions: widgetState().sessionList, entertainment: { open: !!S.ent.visible }, customSound: '',
    errors: S.bridgeOk ? [] : [{ id: 'bridge', severity: 'error', message: 'The local bridge is not running, so agent activity cannot be seen.', hint: 'Vibe Play starts it automatically; if this stays, restart Vibe Play.' }],
    agents, permissions: permissions(), shortcutErrors: { toggleAutomation: null, toggleWidget: null }, version: '0.2.0', build: 'demo',
    logPath: IS_WIN ? '%LOCALAPPDATA%\\WaitPlay\\logs\\waitplay.log' : '~/Library/Logs/WaitPlay/waitplay.log', website: '#', supportUrl: '#', update: S.update };
}
function pushSettings(){ call('settings', w => w.wpSettings.update({ settings: S.settings, runtime: runtimeState() })); }
function demoInsights(range){
  const n = { today: 1, '7d': 7, '30d': 30, all: 45 }[range] || 7, days = [], base = Date.UTC(2025, 2, 1);
  for (let i = n - 1; i >= 0; i--) { const sess = (i * 7 + 3) % 6 + (i % 3 === 0 ? 2 : 0); days.push({ day: new Date(base + (45 - i) * 86400000).toISOString().slice(0, 10), sessions: sess, workMs: sess * 660000, waitMs: sess * 210000 }); }

  return { range, sessions: ses, completed: ses - 1, failed: 1, abandoned: 0, workMs: wk, waitMs: sum('waitMs'), totalMs: wk + sum('waitMs'), avgMs: 870000, longestMs: 3120000, withEntertainmentMs: wk * .7,
    entertainment: { totalMs: wk * .7, launches: Math.round(ses * .6), autoLaunches: Math.round(ses * .55), avgMs: 540000, top: 'youtube', platforms: [{ site: 'youtube', count: Math.round(ses * .35), ms: wk * .4 }, { site: 'instagram', count: Math.round(ses * .2), ms: wk * .25 }, { site: 'x', count: Math.round(ses * .05), ms: wk * .05 }] },
    agents: [{ agent: 'claude-code', sessions: Math.round(ses * .6), ms: wk * .6 }, { agent: 'cursor', sessions: Math.round(ses * .25), ms: wk * .25 }, { agent: 'codex', sessions: Math.round(ses * .15), ms: wk * .15 }], days };
}
function onSettings(m, d){
  if (m.t === 'ready') pushSettings();
  else if (m.t === 'set') patchSettings(m.patch || {});
  else if (m.t === 'toggleAutomation') toggleAutomation();
  else if (m.t === 'openAccount') openWin('account');
  else if (m.t === 'openEntertainment') openEnt(true);
  else if (m.t === 'installIntegration') { S.integrations[m.agent] = 'configured'; pushSettings(); }
  else if (m.t === 'removeIntegration') { S.integrations[m.agent] = 'notConfigured'; pushSettings(); }
  else if (m.t === 'checkUpdates') { S.update = { state: 'checking', detail: '' }; pushSettings(); later(900, () => { S.update = { state: 'upToDate', detail: '' }; pushSettings(); }); }
  else if (m.t === 'hideEntertainment') closeEnt(true);
  else if (m.t === 'insights') call('settings', w => w.wpInsights && w.wpInsights(demoInsights(m.range)));
  else if (m.t === 'recent') call('settings', w => w.wpRecent && w.wpRecent({ sessions: [{ agent: 'claude-code', start: Date.now() - 3.2e6, end: Date.now() - 2.6e6, workMs: 5e5, waitMs: 6e4, outcome: 'completed' }, { agent: 'codex', start: Date.now() - 9e6, end: Date.now() - 8.7e6, workMs: 2.2e5, waitMs: 0, outcome: 'completed' }, { agent: 'cursor', start: Date.now() - 2e7, end: Date.now() - 1.95e7, workMs: 3e5, waitMs: 1e5, outcome: 'failed' }] }));
  else if (m.t === 'quit') quitApp();
  else if (m.t === 'drag') startDrag(setWin, d.at[0], d.at[1]);
}

/* ---- account window (real account page) ---- */
const accWin = mkWin('account', IS_WIN ? 480 : 520, 80, 400, 620 + SET_TOP);
const accHolder = el('div', { style: `position:absolute;left:0;right:0;bottom:0;top:${SET_TOP}px` });
if (IS_WIN) accWin.append(chrome(accWin, 'Vibe Play Account', 0, { close: () => closeWin('account') }));
else { const c = chrome(accWin, '', 0, { close: () => closeWin('account') }); c.remove(); }
accWin.append(accHolder);
function accountView(){
  if (S.account.state !== 'signedIn') return { configured: true, state: 'signedOut' };
  return { configured: true, state: 'signedIn', user: { name: S.account.name, email: S.account.email, verified: true, provider: S.account.provider }, plan: 'free', accountStatus: 'active', deviceLimit: 2,
    devices: [{ id: 'd1', name: IS_WIN ? 'Windows desktop' : 'MacBook Pro', platform: IS_WIN ? 'windows' : 'macos', current: true, revoked: false, lastSeen: Math.floor(Date.now() / 1000) }, { id: 'd2', name: IS_WIN ? 'MacBook Pro' : 'Windows desktop', platform: IS_WIN ? 'macos' : 'windows', current: false, revoked: !!S.account.d2gone, lastSeen: Math.floor(Date.now() / 1000) - 7200 }], syncedAt: Math.floor(Date.now() / 1000) };
}
function onAccount(m){
  const res = (r) => call('account', w => w.wpAccount.result(r));
  const signIn = (email, provider) => { S.account = { state: 'signedIn', email, name: (email || 'you').split('@')[0].replace(/^./, c => c.toUpperCase()), provider }; call('account', w => w.wpAccount.set(accountView())); };
  if (m.t === 'ready') call('account', w => w.wpAccount.set(accountView()));
  else if (m.t === 'google') later(1500, () => { signIn('maya.rivera@gmail.com', 'google'); res({ op: 'google', ok: true }); });
  else if (m.t === 'signInPassword' || m.t === 'signUp') later(700, () => { signIn(m.email || 'you@example.com', 'email'); res({ op: m.t, ok: true, outcome: 'signedIn' }); });
  else if (m.t === 'sendCode') later(600, () => res({ op: 'sendCode', ok: true }));
  else if (m.t === 'verifyCode') later(600, () => { signIn(m.email || 'you@example.com', 'email'); res({ op: 'verifyCode', ok: true }); });
  else if (m.t === 'forgot') later(600, () => res({ op: 'forgot', ok: true }));
  else if (m.t === 'signOut' || m.t === 'deleteAccount') later(500, () => { S.account = { state: 'signedOut' }; call('account', w => w.wpAccount.set(accountView())); res({ op: m.t, ok: true }); });
  else if (m.t === 'setName') later(400, () => { S.account.name = m.name; res({ op: 'setName', ok: true }); });
  else if (m.t === 'revokeDevice') later(400, () => { S.account.d2gone = true; call('account', w => w.wpAccount.set(accountView())); res({ op: 'revokeDevice', ok: true }); });
  else if (m.t === 'signOutOthers') later(400, () => res({ op: 'signOutOthers', ok: true }));
}
function openWin(name){
  if (!S.running) return;
  const w = name === 'settings' ? setWin : accWin;
  if (name === 'settings' && !setFrame) { setFrame = makeFrame('settings', setHolder); setFrame.style.cssText = 'width:100%;height:100%'; }
  if (name === 'account' && !frames.account) { const f = makeFrame('account', accHolder); f.style.cssText = 'width:100%;height:100%'; }
  w.classList.remove('hide'); focusWin(w); if (name === 'settings') pushSettings();
}
function closeWin(name){ (name === 'settings' ? setWin : accWin).classList.add('hide'); if (S.fg === 'waitplay') { S.fg = 'desktop'; syncAway(); } }

/* ---- settings patch (Settings::apply_patch) ---- */
function patchSettings(p){
  const s = S.settings;
  for (const k in p) {
    if (k === 'platforms') { const next = Object.assign({}, s.platforms, p.platforms); if (SITES.some(([x]) => next[x])) s.platforms = next; if (!s.platforms[s.preferredPlatform]) s.preferredPlatform = SITES.find(([x]) => s.platforms[x])[0]; }
    else if (k === 'preferredPlatform') { if (s.platforms[p[k]]) s.preferredPlatform = p[k]; }
    else if (k === 'shortcuts') Object.assign(s.shortcuts, p.shortcuts);
    else if (k === 'soundEvents') Object.assign(s.soundEvents, p.soundEvents);
    else if (k === 'widgetPosition') { if (POS.some(([x]) => x === p[k])) s.widgetPosition = p[k]; }
    else if (k in s) s[k] = p[k];
  }
  if ('appearance' in p) applyTheme();
  if ('platforms' in p && frames.header) reloadFrame('header', headerHtml);
  if (S.ent.visible) { S.ent.site = s.preferredPlatform; renderSite(); syncHeader(); }
  layoutEnt(); placeWidget(); syncTaskbar(); render(); pushSettings();
  $$('#segPos button').forEach(b => b.classList.toggle('on', b.dataset.p === s.widgetPosition));
}
function toggleAutomation(){ S.enabled = !S.enabled; if (!S.enabled && S.ent.visible) closeEnt(false); render(); }
function applyTheme(){
  const dark = S.settings.appearance === 'dark';
  const changed = stage.classList.contains('dark') !== dark;
  S.dark = dark; stage.classList.toggle('dark', dark); stage.classList.toggle('light', !dark);
  $$('#segTheme button').forEach(b => b.classList.toggle('on', (b.dataset.t === 'dark') === dark));
  if (changed) for (const n of Object.keys(frames)) reloadFrame(n, n === 'header' ? headerHtml : null);
}

/* ---- render everything that depends on state ---- */
function render(){
  tray.dataset.s = S.running ? overall() : 'off';
  pushWidget(); pushSettings(); syncHeader(); placeWidget();
}

/* ---- notification + toast ---- */
let nTimer;
function banner(title, body){ $('#nTitle').textContent = title; $('#nBody').textContent = body; $('#notif').classList.add('on'); clearTimeout(nTimer); nTimer = setTimeout(() => $('#notif').classList.remove('on'), 5200); }
function quitApp(){ S.running = false; widgetWin.style.display = 'none'; ent.classList.add('hide'); setWin.classList.add('hide'); accWin.classList.add('hide'); S.ent.visible = false; tray.dataset.s = 'off'; tray.style.opacity = .4;
  $('#toastMsg').innerHTML = '<b>Vibe Play quit</b><br><span style="opacity:.7">The ' + (IS_WIN ? 'tray icon' : 'menu bar item') + ' and the widget are gone.</span>'; $('#toast').style.display = 'block'; }
$('#relaunch').addEventListener('click', () => { S.running = true; tray.style.opacity = 1; $('#toast').style.display = 'none'; render(); });

/* ---- the scripted agent story ---- */
function addSession(agent, terminalName){ const s = S.sessions.find(x => x.agent === agent); if (s) { s.activity = 'working'; return s; } const n = { agent, activity: 'working', terminal: terminalName || TERMINAL_NAME, since: Date.now() }; S.sessions.push(n);
  const live = S.sessions.filter(x => x.activity !== 'idle').length; peak = Math.max(peak, live);
  if (S.enabled) notify('started', live > 1 ? live + ' AI coding sessions are now active.' : AGENT_NAMES[agent] + ' started working.', live > 1 ? S.sessions.filter(x => x.activity !== 'idle').map(x => AGENT_NAMES[x.agent]).join(', ') : siteLabel(S.settings.preferredPlatform) + ' is opening.');
  return n; }
function maybeAutoOpen(){ if (S.enabled && S.bridgeOk && !S.ent.visible) later(1700, () => { if (S.sessions.some(s => s.activity === 'working') && S.enabled && !S.ent.visible && !S.ent.dismissed) openEnt(false, false); }); }
function runPrompt(text){
  if (!S.running) return;
  if (S.sessions.some(s => s.agent === 'claude-code' && s.activity !== 'idle')) return;
  if (S.termMin) minTerm(false); else focusWin(term);
  const prompt = text || 'add rate limiting to the checkout API and cover it with tests';
  tline('<span class="acc">' + (IS_WIN ? 'PS>' : '\u203a') + '</span> ' + prompt.replace(/</g, '&lt;'));
  const think = tline('<span class="acc spin">\u273b</span> Pondering\u2026 <span class="dim">(esc to interrupt)</span>');
  S.ent.dismissed = false; addSession('claude-code', TERMINAL_NAME); S.justFinished = null; render(); maybeAutoOpen(); markDone('prompt');
  [[1500, () => tline('<span class="ok">\u25cf</span> Read(<span class="dim">src/api/checkout.ts</span>)')],
   [3200, () => tline('<span class="ok">\u25cf</span> Update(<span class="dim">src/api/rateLimit.ts</span>)\n  <span class="dim">\u23bf Added 38 lines</span>')],
   [5200, () => tline('<span class="ok">\u25cf</span> Bash(<span class="dim">npm test</span>)\n  <span class="dim">\u23bf 42 passed, 0 failed</span>')],
   [14000, () => finishAgent('claude-code', think)]].forEach(([t, fn]) => later(t + 1000, fn));
}
function finishAgent(id, think){
  const s = S.sessions.find(x => x.agent === id); if (!s) return; s.activity = 'idle'; s.endedAt = Date.now();
  { const left = S.sessions.filter(x => x.activity !== 'idle'), plat = siteLabel(S.settings.preferredPlatform);
    if (left.length) notify('done', AGENT_NAMES[id] + ' completed.', (left.length === 1 ? AGENT_NAMES[left[0].agent] + ' is still working.' : left.length + ' sessions are still working.') + (S.ent.visible ? ' ' + plat + ' stays open.' : ''));
    else { notify(peak > 1 ? 'alldone' : 'done', peak > 1 ? 'All coding sessions completed.' : AGENT_NAMES[id] + ' finished its task.', peak > 1 && S.ent.visible ? 'Your entertainment window is closing.' : 'You can get back to your code.'); peak = 0; } }
  if (think) think.remove();
  if (id === 'claude-code') tline('<span class="ok">\u25cf</span> Done. Added a token-bucket limiter to checkout and 6 tests, all passing.');
  if (!S.sessions.some(x => x.activity !== 'idle')) {
    S.justFinished = AGENT_NAMES[id];
    if (S.ent.visible || S.ent.opened) { if (S.settings.onFinish === 'close') S.ent.opened = false; closeEnt(false); }
    render();
    later(4200, () => { S.justFinished = null; S.sessions = S.sessions.filter(x => x.activity !== 'idle'); render(); });
  } else render();
}
function startSecond(){
  if (!S.sessions.some(s => s.agent === 'claude-code' && s.activity === 'working')) { runPrompt(''); later(900, startSecond); return; }
  addSession('codex', IS_WIN ? 'PowerShell' : 'iTerm2'); render(); markDone('second'); tline('<span class="dim">(Codex started in ' + (IS_WIN ? 'PowerShell' : 'iTerm2') + ': Vibe Play now tracks 2 sessions)</span>');
  later(6500, () => finishAgent('codex'));
}
function needsYou(){
  if (!S.sessions.some(s => s.agent === 'claude-code' && s.activity !== 'idle')) { runPrompt(''); later(2600, needsYou); return; }
  const s = S.sessions.find(x => x.agent === 'claude-code'); s.activity = 'waiting'; render(); markDone('needs');
  const box = tline('<div class="perm">\u26a0 Claude Code wants to run <b>' + (IS_WIN ? 'Remove-Item .\\build -Recurse' : 'rm -rf ./build') + '</b><br><button class="p">Allow</button><button>Deny</button></div>');
  banner('Claude Code needs your input', 'Allow this command?');
  box.querySelectorAll('button').forEach(b => b.addEventListener('click', () => { box.remove(); s.activity = 'working'; $('#notif').classList.remove('on'); tline('<span class="dim">\u23bf ' + (b.classList.contains('p') ? 'Allowed' : 'Denied') + '</span>'); render(); later(3000, () => finishAgent('claude-code')); }));
}
function finishAll(){ markDone('finish'); for (const s of S.sessions) if (s.activity !== 'idle') finishAgent(s.agent); if (!S.sessions.length) { S.justFinished = 'Claude Code'; render(); later(3500, () => { S.justFinished = null; render(); }); } }
function bridgeDown(){ S.bridgeOk = !S.bridgeOk; markDone('bridge'); if (!S.bridgeOk && S.ent.visible) closeEnt(false); render(); $('[data-step=bridge] b').textContent = S.bridgeOk ? 'Break the local bridge' : 'Bring the bridge back'; if (S.bridgeOk) syncAway(); }
function resetDemo(){
  timers.forEach(clearTimeout); timers = []; const dark = S.dark; S = initial(); S.dark = dark; done = new Set(); entZoom = false; wSize = { w: 364, h: 96 };
  ent.classList.add('hide'); setWin.classList.add('hide'); accWin.classList.add('hide'); other.classList.add('hide'); term.classList.remove('hide'); doFullscreen(false);
  $('#notif').classList.remove('on'); $('#toast').style.display = 'none'; tray.style.opacity = 1; $('#minTermB').textContent = 'Minimize the Terminal';
  $$('.btn').forEach(b => b.classList.remove('done')); $('[data-step=bridge] b').textContent = 'Break the local bridge';
  termReset(); reloadFrame('widget'); if (frames.account) reloadFrame('account'); applyTheme(); layoutEnt(); render(); syncTaskbar();
  $$('#segPos button').forEach(b => b.classList.toggle('on', b.dataset.p === DEFAULT_POS));

/* ---- dock (macOS) / taskbar (Windows) ---- */
function syncTaskbar(){
  const ic = (bg, glyph, run, label, onclick, act) => el('div', { class: IS_WIN ? 'tbi' + (run ? ' run' : '') + (act ? ' act' : '') : 'dk' + (run ? ' run' : ''), title: label, style: IS_WIN ? '' : `background:${bg}`, onclick }, IS_WIN ? el('i', { style: `background:${bg}` }, glyph) : glyph);

  if (IS_WIN) {
    const bar = $('#tbIcons'); bar.replaceChildren(
      el('div', { class: 'tbi', title: 'Start' }, el('div', { class: 'start' }, el('b'), el('b'), el('b'), el('b'))),
      el('div', { class: 'tbi', title: 'Search', style: 'width:150px;justify-content:flex-start;padding-left:12px;font-size:12px;color:var(--fg);background:rgba(120,120,128,.18);border-radius:20px' }, '\u2315  Search'),
      ic('linear-gradient(180deg,#444,#111)', '>_', true, 'Windows Terminal', () => { if (S.termMin) minTerm(false); else if (S.fg === 'terminal') minTerm(true); else toTerminal(); }, termActive),
      ic('linear-gradient(180deg,#34c759,#248a3d)', '\u{1F5C2}', false, 'File Explorer', () => openOther()),
      ic('linear-gradient(180deg,#ff9f0a,#ff6a00)', '\u270e', !other.classList.contains('hide'), 'Notepad', () => openOther(), S.fg === 'other'));
    if (S.settings.showDockIcon === false) {}
  } else {
    const dock = $('#dock'); dock.replaceChildren(
      ic('linear-gradient(180deg,#5ac8fa,#0a84ff)', '\u263a', true, 'Finder', () => openOther()), ic('linear-gradient(180deg,#34c759,#248a3d)', '\u2709', false, 'Messages', () => openOther()),
      ic('linear-gradient(180deg,#444,#111)', '>_', true, 'Terminal', () => toTerminal()), ic('linear-gradient(180deg,#ff9f0a,#ff6a00)', '\u270e', false, 'Notes', () => openOther()));
    if (S.settings.showDockIcon) dock.append(el('div', { class: 'dk run', title: 'Vibe Play', style: 'background:linear-gradient(135deg,#8b92ff,#4046e0)', onclick: () => openWin('settings') }, '\u25b6'));
    dock.append(ic('linear-gradient(180deg,#8e8e93,#636366)', '\u2699', false, 'System Settings', () => openOther()));
  }
}

/* ---- scaling + clock + wiring ---- */
function scale(){ return parseFloat(stage.dataset.scale || '1'); }
function fit(){
  const wide = window.innerWidth > 1000, avail = wide ? window.innerWidth - 330 - 18 * 3 : window.innerWidth - 36, sc = Math.min(avail / 1440, (window.innerHeight - 36) / 900, 1.3);
  const s = Math.max(.25, sc); stage.dataset.scale = s; stage.style.transform = `scale(${s})`; const w = $('#stageWrap'); w.style.width = 1440 * s + 'px'; w.style.height = 900 * s + 'px';
}
window.addEventListener('resize', fit);
function tick(){ const d = new Date(); $('#clock').textContent = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); $('#clock2').innerHTML = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) + '<br>' + d.toLocaleDateString(); }
setInterval(tick, 20000); tick();

document.addEventListener('keydown', e => {
  if (e.ctrlKey && e.altKey && e.code === 'KeyW') { e.preventDefault(); toggleAutomation(); }
  else if (e.ctrlKey && e.altKey && e.code === 'KeyH') { e.preventDefault(); patchSettings({ showWidget: !S.settings.showWidget }); }
  else if (e.key === 'Escape' && S.fullscreen) doFullscreen(false);
});
$$('[data-step]').forEach(b => b.addEventListener('click', () => {
  ({ prompt: () => runPrompt(''), second: startSecond, needs: needsYou, finish: finishAll, bridge: bridgeDown, reset: resetDemo,
     menu: openTrayMenu, expand: () => call('widget', w => w.wpWidget.expand(true)), settings: () => openWin('settings'), account: () => openWin('account'), ent: () => openEnt(true),
     minterm: () => minTerm(!S.termMin), other: () => { markDone('other'); openOther(); }, backterm: () => { markDone('backterm'); toTerminal(); },
     fullscreen: () => doFullscreen(!S.fullscreen) })[b.dataset.step]();
}));
$('#fsx').addEventListener('click', () => doFullscreen(false));
$$('#segTheme button').forEach(b => b.addEventListener('click', () => patchSettings({ appearance: b.dataset.t })));
$$('#segPos button').forEach(b => b.addEventListener('click', () => patchSettings({ widgetPosition: b.dataset.p })));
widgetWin.addEventListener('contextmenu', e => e.preventDefault());

fit(); syncTaskbar(); termReset(); layoutEnt(); placeWidget(); applyTheme();
$$('#segPos button').forEach(b => b.classList.toggle('on', b.dataset.p === DEFAULT_POS));
focusWin(term);
})();
